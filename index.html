<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dietary · Bia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%2316A34A'/%3E%3Cpath d='M50 20 C38 20 28 33 33 48 C38 63 50 70 50 70 C50 70 62 63 67 48 C72 33 62 20 50 20Z' fill='white' opacity='.9'/%3E%3Cline x1='50' y1='22' x2='50' y2='70' stroke='%2316A34A' stroke-width='2'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

/* ═══ DESIGN SYSTEM ═══ */
:root{
  --g:#16A34A;--gb:#22C55E;--gl:#DCFCE7;--gd:#14532D;
  --or:#F97316;--orl:#FFF7ED;
  --bg:#F6F9F5;--sf:#FFFFFF;--sf2:#EEF4F0;--sf3:#E5EFE8;
  --t1:#0C1810;--t2:#4A6B56;--t3:#8EAD98;
  --bd:#DDE8E2;--sh:rgba(20,83,45,.07);--sh2:rgba(20,83,45,.12);
  --r:18px;--r-sm:12px;--nh:68px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  /* meal time accents */
  --c-morning:#F59E0B;--c-midday:#0EA5E9;--c-lunch:#16A34A;
  --c-workout:#8B5CF6;--c-dinner:#3B82F6;--c-night:#1E40AF;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  -webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'
}
[data-dark]{
  --bg:#060D08;--sf:#0E1A11;--sf2:#162019;--sf3:#1E2B21;
  --t1:#E6F0EA;--t2:#7BA88A;--t3:#4A6B56;
  --bd:#1F3024;--sh:rgba(0,0,0,.4);--sh2:rgba(0,0,0,.6);
  --gl:#0D2810;--gd:#4ADE80;--g:#22C55E;--gb:#4ADE80
}
html,body{height:100%;height:100dvh;overflow:hidden;background:var(--bg)}
[data-dark] body{background:var(--bg)}

/* ═══ SPLASH ═══ */
#splash{
  position:fixed;inset:0;z-index:999;
  background:linear-gradient(170deg,#0F4722 0%,#15803D 50%,#1EA855 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding-bottom:max(60px,env(safe-area-inset-bottom,40px));transition:opacity .55s ease
}
#splash.out{opacity:0;pointer-events:none}
.sl-leaf{opacity:0;animation:sl-logo-in .65s cubic-bezier(.22,.68,0,1.1) .15s forwards}
.sl-name{
  font-size:38px;font-weight:800;color:#fff;letter-spacing:-.5px;text-shadow:0 2px 16px rgba(0,0,0,.2);
  opacity:0;animation:sl-up .5s ease .7s forwards;margin-top:18px;
  text-shadow:0 2px 20px rgba(0,0,0,.15)
}
.sl-tag{
  font-size:15px;font-weight:400;color:rgba(255,255,255,.75);
  opacity:0;animation:sl-up .5s ease .95s forwards;margin-top:6px;
  letter-spacing:.3px
}
@keyframes sl-fade{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes sl-logo-in{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes sl-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.sl-leaf,.sl-name,.sl-tag{animation:none;opacity:1}}

/* ═══ APP SHELL ═══ */
#app{
  height:100%;height:100dvh;background:var(--bg);
  display:flex;flex-direction:column;max-width:430px;margin:0 auto;
  overflow:hidden;transition:background .3s
}
#hdr{flex-shrink:0;padding:calc(var(--sat) + 16px) 20px 14px;background:var(--bg);transition:background .3s}
#cnt{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px}
#cnt.pb{padding-bottom:calc(var(--nh) + var(--sab) + 16px)}
#cnt.nb{padding-bottom:calc(var(--nh) + var(--sab) + 132px)}
::-webkit-scrollbar{display:none}*{scrollbar-width:none}

/* ═══ BOTTOM NAV ═══ */
#nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:430px;
  height:calc(var(--nh) + var(--sab));padding-bottom:var(--sab);
  background:var(--sf);border-top:1px solid var(--bd);
  display:flex;align-items:center;z-index:60;transition:background .3s;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)
}
.nv{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px;cursor:pointer;user-select:none;position:relative;
  transition:transform .15s
}
.nv:active{transform:scale(.93)}
.nv-ico{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border-radius:10px;transition:all .25s cubic-bezier(.34,1.56,.64,1);color:var(--t3)
}
.nv-ico svg{width:20px;height:20px;transition:stroke .2s}
.nv-lbl{font-size:10px;font-weight:500;color:var(--t3);transition:color .2s;letter-spacing:.2px}
.nv.on .nv-ico{background:var(--gl);color:var(--g);transform:scale(1.1) translateY(-1px)}
.nv.on .nv-ico svg{stroke:var(--g)}
.nv.on .nv-lbl{color:var(--g);font-weight:700}

/* ═══ CARDS ═══ */
.card{background:var(--sf);border-radius:var(--r);box-shadow:0 1px 8px var(--sh),0 0 0 1px rgba(0,0,0,.03)}

/* ═══ TODAY ═══ */
.greet{font-size:24px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.gdt{font-size:13px;color:var(--t3);margin-top:3px;font-weight:400;letter-spacing:.1px}

/* Progress card */
.pcrd{padding:18px;margin:14px 0 12px;background:linear-gradient(135deg,var(--sf) 0%,var(--sf2) 100%)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.pl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3)}
.pn{font-size:13px;font-weight:700;color:var(--g)}
.pb-bg{height:6px;background:var(--sf3);border-radius:99px;overflow:hidden}
.pb-f{height:100%;background:linear-gradient(90deg,var(--g),var(--gb));border-radius:99px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.pdots{display:flex;gap:5px;margin-top:12px}
.pd{flex:1;height:3px;background:var(--sf3);border-radius:99px;transition:background .4s}
.pd.done{background:var(--g)}.pd.opt{background:var(--bd)}

/* Meal cards */
.mc{
  background:var(--sf);border-radius:var(--r);margin-bottom:10px;
  box-shadow:0 1px 8px var(--sh),0 0 0 1px rgba(0,0,0,.03);
  cursor:pointer;transition:transform .14s ease,box-shadow .14s ease;
  overflow:hidden;display:flex;position:relative
}
.mc:active{transform:scale(.984);box-shadow:0 1px 4px var(--sh)}
.mc.done{opacity:.65}
.mc-accent{width:3.5px;flex-shrink:0;border-radius:3.5px 0 0 3.5px}
.mc-in{flex:1;padding:14px 14px 14px 12px}
.mc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
.mc-tr{display:flex;align-items:center;gap:10px}
.mc-icon-wrap{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.mc-nm{font-size:14px;font-weight:700;color:var(--t1);letter-spacing:-.1px}
.mc-tm{font-size:11px;color:var(--t3);margin-top:2px;font-weight:500}
.bdg{font-size:10px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.2px;flex-shrink:0;display:flex;align-items:center;gap:4px}
.bdg.done{background:var(--gl);color:var(--gd)}
.bdg.pend{background:var(--sf2);color:var(--t3)}
.bdg.opt{background:#FFF7ED;color:#B45309}
.prev{display:flex;flex-wrap:wrap;gap:5px}
.pchp{font-size:11px;color:var(--t2);background:var(--sf2);padding:3px 9px;border-radius:99px;font-weight:500}

/* ═══ BOTTOM SHEET ═══ */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;opacity:0;pointer-events:none;transition:opacity .28s ease}
#ov.on{opacity:1;pointer-events:all}
#sh{
  position:fixed;bottom:0;left:50%;
  transform:translateX(-50%) translateY(102%);
  width:100%;max-width:430px;background:var(--sf);
  border-radius:26px 26px 0 0;z-index:80;max-height:88vh;overflow-y:auto;
  transition:transform .33s cubic-bezier(.32,.72,0,1);
  padding-bottom:calc(20px + var(--sab));
  box-shadow:0 -4px 40px rgba(0,0,0,.18)
}
#sh.on{transform:translateX(-50%) translateY(0)}
.shh{width:36px;height:4px;background:var(--bd);border-radius:2px;margin:14px auto 6px}
.shb{padding:10px 20px 4px}
.sh-tr{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.sh-meal-ico{width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0}
.sh-ti{font-size:20px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.sh-su{font-size:12px;color:var(--t3);margin-top:2px;font-weight:500}
.slbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin:18px 0 10px}
.frow{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.frow:last-of-type{border:none}
.fi{font-size:20px;margin-right:12px;flex-shrink:0}
.fn{flex:1;font-size:14px;font-weight:500;color:var(--t1)}
.fq{font-size:12px;color:var(--t3);font-weight:500}

/* Protein/option grid */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.oc{
  background:var(--sf2);border:2px solid transparent;border-radius:14px;
  padding:13px 10px;cursor:pointer;transition:all .15s;text-align:center
}
.oc:active{transform:scale(.96)}
.oc.sel{border-color:var(--g);background:var(--gl)}
.oc-i{font-size:24px}.oc-n{font-size:12px;font-weight:700;color:var(--t1);margin-top:5px;line-height:1.3}
.oc-q{font-size:11px;color:var(--t3);margin-top:2px}
.sptgl{display:flex;align-items:center;background:linear-gradient(135deg,var(--sf2),var(--sf3));border-radius:14px;padding:13px 16px;cursor:pointer;margin:14px 0 8px;gap:10px;border:1px solid var(--bd)}
.sptgl span{flex:1;font-size:13px;font-weight:600;color:var(--t1)}
.spar{font-size:13px;color:var(--t3)}
.spc{background:var(--sf2);border:2px solid transparent;border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;transition:all .14s}
.spc:active{transform:scale(.98)}
.spc.sel{border-color:var(--or);background:var(--orl)}
.spc-h{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.spc-n{font-size:13px;font-weight:700;color:var(--t1)}
.spc-it{font-size:12px;color:var(--t3);line-height:1.7}
.fwoc{background:var(--sf2);border:2px solid transparent;border-radius:14px;padding:15px;cursor:pointer;display:flex;align-items:center;gap:14px;margin-bottom:8px;transition:all .14s}
.fwoc:active{transform:scale(.985)}
.fwoc.sel{border-color:var(--g);background:var(--gl)}
.fwoc-i{font-size:28px;flex-shrink:0}
.fwoc-n{font-size:14px;font-weight:700;color:var(--t1)}
.fwoc-s{font-size:12px;color:var(--t3);margin-top:3px;line-height:1.4}

/* Buttons */
.bm{width:100%;padding:16px;background:var(--g);color:#fff;border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit;transition:all .15s;letter-spacing:.1px;box-shadow:0 3px 12px rgba(22,163,74,.25)}
.bm:active{transform:scale(.98);box-shadow:0 2px 6px rgba(22,163,74,.2)}
.bm:disabled{background:var(--bd);color:var(--t3);cursor:default;transform:none;box-shadow:none}
.bs{width:100%;padding:14px;background:var(--sf2);color:var(--t1);border:none;border-radius:16px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;font-family:inherit;border:1px solid var(--bd)}
.bu{width:100%;padding:14px;background:transparent;color:#EF4444;border:1.5px solid #FECACA;border-radius:16px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px;font-family:inherit;transition:background .15s}
.bu:active{background:#FEF2F2}
.bkbtn{background:var(--sf2);border:1px solid var(--bd);border-radius:99px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--t1);font-family:inherit;margin-bottom:16px;display:inline-flex;align-items:center;gap:5px}

/* ADD FOOD */
.add-form{background:var(--sf2);border-radius:16px;padding:16px;margin-top:16px;border:1px solid var(--bd)}
.add-row{display:flex;gap:8px;margin-bottom:12px}
.ae-i{width:52px;background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:10px;font-size:18px;text-align:center;color:var(--t1);font-family:inherit;outline:none}
.ae-n{flex:1;background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:10px 14px;font-size:14px;color:var(--t1);font-family:inherit;outline:none;min-width:0}
.ae-q{width:70px;background:var(--sf);border:1.5px solid var(--bd);border-radius:12px;padding:10px;font-size:13px;color:var(--t1);font-family:inherit;outline:none}
.ae-i:focus,.ae-n:focus,.ae-q:focus{border-color:var(--g)}
.epick{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.ep{font-size:22px;cursor:pointer;padding:3px;border-radius:7px;line-height:1.3}
.ep:active{background:var(--gl)}
.add-sv{flex:1;padding:12px;background:var(--g);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.add-cv{padding:12px 16px;background:var(--sf);color:var(--t2);border:1.5px solid var(--bd);border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.add-btn{width:100%;padding:13px;background:transparent;color:var(--g);border:1.5px dashed rgba(22,163,74,.4);border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit;transition:background .15s}
.add-btn:active{background:var(--gl)}
.ext-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px dashed var(--bd)}
.ext-del{background:none;border:none;cursor:pointer;color:var(--t3);font-size:16px;padding:4px 0 4px 10px;flex-shrink:0;line-height:1}

/* ═══ AI TAB ═══ */
.ai-hdr{display:flex;align-items:center;gap:14px}
.ai-hdr-info{}
.ai-hdr-name{font-size:18px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.ai-hdr-sub{font-size:12px;color:var(--t3);margin-top:2px;font-weight:500}
.ai-status{display:flex;align-items:center;gap:6px;margin-top:4px}
.ai-dot{width:7px;height:7px;border-radius:50%;background:var(--gb);animation:pulse-g 2s ease infinite}
@keyframes pulse-g{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.ai-status-txt{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:.3px;text-transform:uppercase}

/* Chat */
.ai-empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 20px 16px}
.aie-t{font-size:20px;font-weight:800;color:var(--t1);margin-bottom:8px;letter-spacing:-.3px}
.aie-s{font-size:14px;color:var(--t2);line-height:1.6;max-width:260px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px}
.chip{
  flex-shrink:0;background:var(--sf);border:1px solid var(--bd);border-radius:99px;box-shadow:0 2px 8px var(--sh);
  padding:8px 14px;font-size:12px;font-weight:500;color:var(--t2);cursor:pointer;
  white-space:nowrap;box-shadow:0 1px 4px var(--sh);transition:all .15s
}
.chip:active{background:var(--gl);border-color:var(--g);color:var(--gd)}
.msgs{display:flex;flex-direction:column;gap:12px;padding:10px 0 16px}
.msg-row{display:flex;align-items:flex-end;gap:8px}
.msg-row.u{justify-content:flex-end}
.msg{max-width:84%;padding:12px 16px;border-radius:20px;font-size:14px;line-height:1.6;animation:msg-in .2s ease}
@keyframes msg-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.u{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;border-bottom-right-radius:5px}
.msg.a{background:var(--sf);color:var(--t1);border-bottom-left-radius:5px;box-shadow:0 1px 8px var(--sh),0 0 0 1px rgba(0,0,0,.04)}
.typ{align-self:flex-start;display:flex;gap:4px;padding:14px 18px;background:var(--sf);border-radius:20px;border-bottom-left-radius:5px;box-shadow:0 1px 8px var(--sh)}
.td{width:7px;height:7px;background:var(--t3);border-radius:50%;animation:tb 1.1s ease infinite}
.td:nth-child(2){animation-delay:.18s}.td:nth-child(3){animation-delay:.36s}
@keyframes tb{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
.tcur{display:inline-block;animation:blink .7s ease infinite}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}

/* AI Bar */
#aibar{position:fixed;bottom:calc(var(--nh) + var(--sab));left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--sf);border-top:1px solid var(--bd);z-index:55;display:none;flex-direction:column;transition:background .3s;backdrop-filter:blur(20px)}
#aibar.on{display:flex}
.aicr{display:flex;gap:7px;overflow-x:auto;padding:10px 14px 0}
#airow{display:flex;gap:10px;align-items:flex-end;padding:10px 14px 12px}
#mic-btn{width:40px;height:40px;border-radius:50%;background:var(--sf2);border:1px solid var(--bd);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
#mic-btn:active{transform:scale(.9)}
#mic-btn.listening{background:#EF4444;border-color:#EF4444;animation:mic-p 1.2s ease infinite}
@keyframes mic-p{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.35)}60%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}
#aiinp{flex:1;background:var(--sf2);border:1.5px solid var(--bd);border-radius:99px;padding:10px 18px;font-size:14px;color:var(--t1);font-family:inherit;outline:none;resize:none;max-height:90px;line-height:1.5;transition:border-color .2s}
#aiinp:focus{border-color:var(--g)}
#aiinp::placeholder{color:var(--t3)}
#aisnd{width:40px;height:40px;border-radius:50%;background:var(--g);border:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 2px 10px rgba(22,163,74,.35)}
#aisnd:active{transform:scale(.9)}
#voice-status{display:none;align-items:center;gap:8px;padding:8px 14px;font-size:12px;color:#EF4444;font-weight:600;background:rgba(239,68,68,.07)}
#voice-status.on{display:flex}
.vs-dot{width:8px;height:8px;border-radius:50%;background:#EF4444;animation:mic-p 1s ease infinite}

/* ═══ PROGRESS ═══ */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sc{padding:18px}
.sv{font-size:36px;font-weight:800;color:var(--g);line-height:1;letter-spacing:-1px}
.sl{font-size:12px;color:var(--t3);margin-top:5px;font-weight:500}
.streak-box{background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:var(--r);padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px;border:1px solid #FCD34D}
.sb-ico{font-size:36px}
.sb-t{font-size:16px;font-weight:800;color:#92400E}
.sb-s{font-size:12px;color:#B45309;margin-top:2px}
.wcrd{padding:18px;margin-bottom:14px}
.wt{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:16px;letter-spacing:-.1px}
.wdg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wdl{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--t3);letter-spacing:.5px}
.wdd{width:34px;height:34px;border-radius:50%;background:var(--sf2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--t3)}
.wdd.has{background:var(--gl);color:var(--gd)}
.wdd.full{background:linear-gradient(135deg,var(--g),var(--gd));color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.3)}
.wdd.today{ring:2px solid var(--g);box-shadow:0 0 0 2px var(--g)}

/* ═══ SETTINGS ═══ */
.ssec{margin-bottom:22px}
.sstl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--t3);margin:0 0 8px 4px}
.scrd{overflow:hidden}
.srow{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--bd);cursor:pointer}
.srow:last-child{border:none}
.si{font-size:20px;margin-right:14px;flex-shrink:0}
.slb{flex:1;font-size:14px;font-weight:500;color:var(--t1)}
.sval{font-size:13px;color:var(--t3);font-weight:500}
.tgl{position:relative;width:48px;height:28px;flex-shrink:0}
.tgl input{opacity:0;width:0;height:0;position:absolute}
.tsl{position:absolute;inset:0;background:var(--bd);border-radius:14px;cursor:pointer;transition:background .2s}
.tsl::before{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;background:#fff;border-radius:50%;transition:transform .22s cubic-bezier(.34,1.56,.64,1);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.tgl input:checked+.tsl{background:var(--g)}
.tgl input:checked+.tsl::before{transform:translateX(20px)}
.sgb{padding:9px 12px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--t2);font-family:inherit;transition:all .15s;white-space:nowrap}
.sgb:active{transform:scale(.96)}
.sgb-on{background:var(--gl);border-color:var(--g);color:var(--gd)}
.sgrow{display:flex;gap:7px;flex-wrap:wrap}
.pfi{width:84px;background:var(--sf2);border:1.5px solid var(--bd);border-radius:12px;padding:9px 12px;font-size:14px;color:var(--t1);text-align:right;font-family:inherit;outline:none}
.pfi:focus{border-color:var(--g)}
.msc{background:linear-gradient(135deg,var(--sf2),var(--sf3));border-radius:14px;padding:16px;text-align:center}
.msv{font-size:26px;font-weight:800;color:var(--g);line-height:1;letter-spacing:-.5px}
.msl{font-size:11px;color:var(--t3);margin-top:5px;font-weight:500}

/* ═══ MISC ═══ */
.notebox{background:var(--gl);border-radius:14px;padding:12px 16px;font-size:13px;color:var(--gd);margin:8px 0 4px;line-height:1.6;border:1px solid rgba(22,163,74,.15)}
.orbox{background:#FFF7ED;border-radius:14px;padding:12px 16px;font-size:13px;color:#92400E;margin:8px 0 12px;line-height:1.6;border:1px solid #FDE68A}
.ti{animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.empty-st{text-align:center;padding:56px 20px}
.es-i{font-size:52px;margin-bottom:16px}
.es-t{font-size:18px;font-weight:700;color:var(--t1)}
.es-s{font-size:13px;color:var(--t3);margin-top:7px;line-height:1.5}

/* ═══ QUESTIONÁRIO ═══ */
#qwrap{
  position:fixed;inset:0;z-index:500;
  background:var(--sf);display:flex;flex-direction:column;
  max-width:430px;margin:0 auto;
  transition:opacity .45s ease,transform .45s ease;
  overflow:hidden
}
#qwrap.out{opacity:0;transform:translateY(30px);pointer-events:none}
.qprog-bar{height:3px;background:var(--sf2);flex-shrink:0}
.qprog-fill{height:100%;background:linear-gradient(90deg,var(--g),var(--gb));border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
.qnav{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px;flex-shrink:0}
.qback{background:none;border:none;cursor:pointer;color:var(--t3);font-size:14px;font-weight:600;padding:4px 0;font-family:inherit;display:flex;align-items:center;gap:5px;-webkit-tap-highlight-color:transparent}
.qback:active{opacity:.6}
.qstep-lbl{font-size:12px;font-weight:600;color:var(--t3);letter-spacing:.5px;text-transform:uppercase}
.qskip{background:none;border:none;cursor:pointer;color:var(--t3);font-size:13px;font-weight:600;padding:4px 0;font-family:inherit;-webkit-tap-highlight-color:transparent}
.qskip:active{opacity:.6}
.qbody{flex:1;overflow-y:auto;padding:16px 24px 24px;display:flex;flex-direction:column}
.qicon{font-size:52px;margin-bottom:20px;animation:q-pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes q-pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.qtitle{font-size:26px;font-weight:800;color:var(--t1);letter-spacing:-.5px;line-height:1.2;margin-bottom:8px}
.qsub{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:28px}
/* Opções */
.qopts{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
.qopt{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;background:var(--sf2);
  border:2px solid transparent;border-radius:16px;
  cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;
  text-align:left
}
.qopt:active{transform:scale(.98)}
.qopt.sel{border-color:var(--g);background:var(--gl)}
.qopt-ico{font-size:26px;flex-shrink:0;line-height:1}
.qopt-txt{}
.qopt-nm{font-size:15px;font-weight:600;color:var(--t1)}
.qopt-ds{font-size:12px;color:var(--t3);margin-top:2px;line-height:1.4}
/* Grid 2 colunas */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.qgopt{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px 12px;background:var(--sf2);
  border:2px solid transparent;border-radius:16px;
  cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;text-align:center
}
.qgopt:active{transform:scale(.97)}
.qgopt.sel{border-color:var(--g);background:var(--gl)}
.qgopt-ico{font-size:28px}
.qgopt-nm{font-size:13px;font-weight:700;color:var(--t1);line-height:1.2}
.qgopt-ds{font-size:11px;color:var(--t3);margin-top:2px;line-height:1.3}
/* Multi-select checkboxes */
.qchecks{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.qck{
  display:flex;align-items:center;gap:14px;
  padding:14px 18px;background:var(--sf2);border:2px solid transparent;
  border-radius:14px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent
}
.qck:active{transform:scale(.98)}
.qck.sel{border-color:var(--g);background:var(--gl)}
.qck-box{width:22px;height:22px;border-radius:7px;border:2px solid var(--bd);background:var(--sf);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;font-size:13px}
.qck.sel .qck-box{background:var(--g);border-color:var(--g);color:#fff}
.qck-ico{font-size:22px;flex-shrink:0}
.qck-txt{font-size:14px;font-weight:500;color:var(--t1)}
/* Inputs numéricos */
.qfields{display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.qfield{background:var(--sf2);border:2px solid var(--bd);border-radius:14px;padding:16px 18px;display:flex;align-items:center;gap:12px;transition:border-color .2s}
.qfield:focus-within{border-color:var(--g)}
.qfield-ico{font-size:22px;flex-shrink:0}
.qfield-lbl{font-size:13px;font-weight:600;color:var(--t2);min-width:60px}
.qfield input{flex:1;background:none;border:none;outline:none;font-size:18px;font-weight:700;color:var(--t1);font-family:inherit;text-align:right}
.qfield input::placeholder{color:var(--t3);font-weight:400;font-size:15px}
.qfield-unit{font-size:13px;color:var(--t3);font-weight:600;flex-shrink:0}
/* Botão próximo */
.qnext{
  width:100%;padding:17px;background:var(--g);color:#fff;
  border:none;border-radius:16px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;margin-top:auto;
  box-shadow:0 4px 16px rgba(22,163,74,.3);transition:all .15s;
  letter-spacing:-.1px;-webkit-tap-highlight-color:transparent
}
.qnext:active{transform:scale(.98);box-shadow:0 2px 8px rgba(22,163,74,.2)}
.qnext:disabled{background:var(--bd);color:var(--t3);box-shadow:none}
/* Tela de resumo */
.qsummary{background:var(--sf2);border-radius:20px;padding:20px;margin-bottom:20px}
.qs-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.qs-row:last-child{border:none}
.qs-k{color:var(--t3);font-weight:500}
.qs-v{color:var(--t1);font-weight:600;text-align:right;max-width:60%}
.qmacros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:24px}
.qmc{background:linear-gradient(135deg,var(--gl),var(--sf));border-radius:14px;padding:14px 10px;text-align:center;border:1px solid rgba(22,163,74,.12)}
.qmc-v{font-size:20px;font-weight:800;color:var(--g);line-height:1}
.qmc-l{font-size:10px;color:var(--t3);margin-top:4px;font-weight:500}
/* Step indicator */
.qtag{display:inline-block;background:var(--gl);color:var(--gd);font-size:11px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:16px}
/* Input de texto */
.qtext-inp{background:var(--sf2);border:2px solid var(--bd);border-radius:14px;padding:16px 18px;font-size:16px;color:var(--t1);font-family:inherit;outline:none;width:100%;margin-bottom:16px;transition:border-color .2s}
.qtext-inp:focus{border-color:var(--g)}
.qtext-inp::placeholder{color:var(--t3)}
.qtip{font-size:12px;color:var(--t3);line-height:1.5;margin-top:-16px;margin-bottom:20px;padding:0 4px}


/* ═══ WELCOME SCREEN ═══ */
#welcome{
  position:fixed;inset:0;z-index:700;
  display:flex;flex-direction:column;align-items:center;
  justify-content:flex-start;
  background:#F8FAF6;
  overflow-y:auto;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 24px calc(env(safe-area-inset-bottom,0px) + 28px);
  transition:opacity .5s ease,transform .5s ease
}
#welcome.wl-out{opacity:0;transform:translateY(-16px);pointer-events:none}
#welcome.wl-hidden{display:none}

/* Orbes de fundo */
.wl-orb{
  position:fixed;border-radius:50%;
  background:radial-gradient(circle,rgba(22,163,74,.08) 0%,transparent 70%);
  pointer-events:none;z-index:0
}

/* Conteúdo sobre os orbes */
.wl-content{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:0}

/* Logo row */
.wl-logo-row{
  display:flex;align-items:center;gap:10px;margin-bottom:18px;
  opacity:0;animation:wl-up .55s cubic-bezier(.2,.7,.2,1) .08s both
}
.wl-logo-mark{width:42px;height:42px;display:block;flex-shrink:0;filter:drop-shadow(0 4px 8px rgba(21,128,61,.12))}
.wl-logo-name{font-size:23px;font-weight:800;color:#14532D;letter-spacing:-.7px}

/* Bia container */
.wl-bia-wrap{
  width:min(220px,66vw);height:clamp(210px,34vh,270px);border-radius:26px;overflow:hidden;
  position:relative;margin-bottom:18px;flex-shrink:0;
  background:linear-gradient(145deg,#EAF8EE,#FFFFFF);
  box-shadow:0 16px 42px rgba(22,163,74,.16),0 5px 16px rgba(0,0,0,.07);
  opacity:0;animation:wl-bia-in .65s cubic-bezier(.22,.68,0,1.15) .28s both
}
.wl-bia-img{
  width:100%;height:100%;
  object-fit:contain;object-position:center;
  display:block
}
/* Fade inferior para ocultar texto BIA */
.wl-bia-fade{
  position:absolute;bottom:0;left:0;right:0;height:50px;
  background:linear-gradient(transparent,rgba(248,250,246,.9) 90%)
}

/* Cards decorativos */
.wl-cards{
  display:flex;gap:10px;width:100%;margin-bottom:24px;
  opacity:0;animation:wl-cards-in .5s ease .62s both
}
.wl-card{
  flex:1;background:#fff;border-radius:16px;padding:14px;
  box-shadow:0 2px 12px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04);
  display:flex;align-items:center;gap:10px
}
.wl-card-ico{font-size:24px;line-height:1;flex-shrink:0}
.wl-card-txt{}
.wl-card-name{font-size:12px;font-weight:700;color:#1A1A2E;line-height:1.2}
.wl-card-kcal{font-size:11px;color:#6B7280;margin-top:2px}

/* Título */
.wl-title{
  font-size:28px;font-weight:800;color:#14532D;
  letter-spacing:-.6px;line-height:1.2;text-align:center;
  margin-bottom:10px;
  opacity:0;animation:wl-up .5s ease .72s both
}
.wl-sub{
  font-size:15px;color:#4A6B56;text-align:center;
  line-height:1.6;margin-bottom:32px;max-width:280px;
  opacity:0;animation:wl-up .45s ease .82s both
}

/* Botão CTA */
.wl-btn{
  width:100%;max-width:320px;padding:17px;
  background:#16A34A;
  color:#fff;border:none;border-radius:16px;
  font-size:16px;font-weight:700;cursor:pointer;
  font-family:inherit;letter-spacing:.1px;
  box-shadow:0 4px 16px rgba(22,163,74,.3);
  transition:transform .12s,box-shadow .12s,background .15s;
  opacity:0;animation:wl-up .45s ease .92s both
}
.wl-btn:active{transform:scale(.97);background:#15803D;box-shadow:0 2px 8px rgba(22,163,74,.2)}

/* Pular para quem não quer esperar */
.wl-skip{
  margin-top:12px;background:none;border:none;cursor:pointer;
  font-size:13px;color:#9CA3AF;font-family:inherit;padding:8px;
  opacity:0;animation:wl-up .4s ease 1s both
}

/* Keyframes */
@keyframes wl-up{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes wl-bia-in{
  from{opacity:0;transform:scale(.95) translateY(16px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}
@keyframes wl-cards-in{
  from{opacity:0;transform:translateX(-10px)}
  to{opacity:1;transform:translateX(0)}
}
@keyframes wl-float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-5px)}
}
.wl-bia-wrap.floating{opacity:1;animation:wl-float 3.5s ease-in-out infinite}
/* Mantém a personagem visível quando a animação de entrada é substituída pela flutuação. */
.wl-bia-wrap:not(.wl-hidden){will-change:transform,opacity}
@media(max-height:720px){
  #welcome{padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px)}
  .wl-logo-row{margin-bottom:12px}
  .wl-bia-wrap{height:clamp(170px,29vh,220px);margin-bottom:12px}
  .wl-cards{margin-bottom:16px;gap:8px}
  .wl-card{padding:10px;gap:7px}
  .wl-title{font-size:25px;margin-bottom:7px}
  .wl-sub{font-size:14px;line-height:1.45;margin-bottom:18px}
  .wl-btn{padding:15px}
}

@media(prefers-reduced-motion:reduce){
  .wl-logo-row,.wl-bia-wrap,.wl-cards,.wl-title,.wl-sub,.wl-btn,.wl-skip{
    animation:none;opacity:1;transform:none
  }
}


/* Welcome screen — dark mode */
[data-dark] #welcome{background:#0A100A}
[data-dark] .wl-card{background:#0E1A11;border:1px solid #1F3024}
[data-dark] .wl-logo-name{color:#4ADE80}
[data-dark] .wl-title{color:#4ADE80}
[data-dark] .wl-sub{color:#7BA88A}
[data-dark] .wl-btn{background:linear-gradient(135deg,#22C55E,#166534)}
[data-dark] .wl-skip{color:#4A6B56}
[data-dark] .wl-bia-fade{background:linear-gradient(transparent,rgba(10,16,10,.9) 90%)}


.sl-logo-img{
  width:180px;height:auto;
  max-width:85vw;
  border-radius:0;
  filter:drop-shadow(0 6px 24px rgba(0,0,0,.25))
}



/* ═══ WELCOME MOTION REFINEMENT — somente animação ═══ */
#welcome .wl-logo-row,
#welcome .wl-bia-wrap,
#welcome .wl-cards,
#welcome .wl-title,
#welcome .wl-sub,
#welcome .wl-btn,
#welcome .wl-skip{
  opacity:0;
  animation:none;
}
#welcome.wl-animating .wl-logo-row{
  animation:welcomeLogoIn .65s cubic-bezier(.2,.75,.25,1) .08s both;
}
#welcome.wl-animating .wl-bia-wrap{
  animation:welcomeBiaIn .9s cubic-bezier(.16,1,.3,1) .22s both;
}
#welcome.wl-animating .wl-cards{
  animation:welcomeCardsIn .65s cubic-bezier(.2,.75,.25,1) .52s both;
}
#welcome.wl-animating .wl-title{
  animation:welcomeTextIn .62s cubic-bezier(.2,.75,.25,1) .68s both;
}
#welcome.wl-animating .wl-sub{
  animation:welcomeTextIn .62s cubic-bezier(.2,.75,.25,1) .82s both;
}
#welcome.wl-animating .wl-btn{
  animation:welcomeButtonIn .68s cubic-bezier(.16,1,.3,1) .98s both;
}
#welcome.wl-animating .wl-skip{
  animation:welcomeTextIn .5s ease 1.12s both;
}
#welcome.wl-float-on .wl-bia-wrap{
  opacity:1;
  animation:welcomeFloat 3.8s ease-in-out infinite;
}
@keyframes welcomeLogoIn{
  0%{opacity:0;transform:translateY(-10px) scale(.96)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes welcomeBiaIn{
  0%{opacity:0;transform:translateY(24px) scale(.91);filter:blur(5px)}
  70%{opacity:1;filter:blur(0)}
  100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}
}
@keyframes welcomeCardsIn{
  0%{opacity:0;transform:translateY(14px) scale(.98)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes welcomeTextIn{
  0%{opacity:0;transform:translateY(12px)}
  100%{opacity:1;transform:translateY(0)}
}
@keyframes welcomeButtonIn{
  0%{opacity:0;transform:translateY(13px) scale(.97)}
  75%{opacity:1;transform:translateY(-2px) scale(1.01)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}
@keyframes welcomeFloat{
  0%,100%{opacity:1;transform:translateY(0)}
  50%{opacity:1;transform:translateY(-6px)}
}
@media(prefers-reduced-motion:reduce){
  #welcome .wl-logo-row,
  #welcome .wl-bia-wrap,
  #welcome .wl-cards,
  #welcome .wl-title,
  #welcome .wl-sub,
  #welcome .wl-btn,
  #welcome .wl-skip{
    animation:none!important;opacity:1!important;transform:none!important;filter:none!important
  }
}

/* Splash de abertura: arte única para evitar logos/textos duplicados e formas sobrepostas */
/* v14 — abertura sem arte de fundo em tela cheia */
#splash.splash-redesign{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#FAFCF9;opacity:1;transition:opacity .45s ease;isolation:isolate}
#splash.splash-redesign.out{opacity:0;pointer-events:none}
#splash.splash-redesign .splash-art{position:relative;inset:auto;width:min(180px,48vw);height:auto;max-height:24vh;object-fit:contain;object-position:center;display:block;animation:splashArtworkIn .7s ease both;transform-origin:center}
@keyframes splashArtworkIn{0%{opacity:0;transform:scale(1.045);filter:brightness(.82)}65%{opacity:1;filter:brightness(1.02)}100%{opacity:1;transform:scale(1);filter:brightness(1)}}
@media(max-height:650px){#splash.splash-redesign .splash-art{width:min(150px,42vw);max-height:20vh;object-fit:contain}}
@media(prefers-reduced-motion:reduce){#splash.splash-redesign .splash-art{animation:none;opacity:1;transform:none;filter:none}}
[data-dark] #splash.splash-redesign{background:#0A100A}



/* v15 — nova arte de boas-vindas incorporada no próprio HTML */
#welcome {
  background: #F8FAF5 !important;
  justify-content: center !important;
}
#welcome .wl-orb { display: none !important; }
#welcome .wl-content {
  max-width: 100% !important;
  width: 100% !important;
  min-height: 100% !important;
  justify-content: center !important;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 104px); /* não deixa o texto sob o botão fixo */
  box-sizing: border-box;
}
/* a arte antiga trazia logo e texto desenhados; agora eles voltam a ser HTML (legíveis e traduzíveis) */
#welcome .wl-cards { display: none !important; }
#welcome .wl-logo-row{display:flex!important;align-items:center;justify-content:center;gap:10px;margin-bottom:22px}
#welcome .wl-title{display:block!important;text-align:center;margin:18px 0 8px}
#welcome .wl-sub{display:block!important;text-align:center;max-width:300px;margin:0 auto}
/* arte de 1,2 MB removida: mostrava outra personagem e cobria o conteúdo real da tela */
#welcome .wl-btn {
  position: absolute;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
  z-index: 3;
  width: min(320px, calc(100% - 48px));
  opacity: 1 !important;
  animation: none !important;
}
@media (max-height: 650px) {
  #welcome .wl-bia-wrap{width:min(150px,42vw)!important}
  #welcome .wl-title{font-size:23px;margin:12px 0 6px}
}
@media (prefers-reduced-motion: reduce) {
}

/* v13 — boas-vindas minimalistas: menos elementos, transições suaves */
#welcome{
  background:#FAFCF9;
  justify-content:center;

<script>
/* V19: recuperação independente para telas brancas durante a inicialização. */
(function () {
  function showRecovery(message) {
    try {
      var old = document.getElementById('dietary-v19-recovery');
      if (old) return;
      var panel = document.createElement('div');
      panel.id = 'dietary-v19-recovery';
      panel.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#f7f8f2;color:#203b2a;font:16px Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px;box-sizing:border-box;overflow:auto';
      var card = document.createElement('div');
      card.style.cssText = 'width:100%;max-width:440px;background:#fff;border:1px solid #e0e7dc;border-radius:20px;padding:22px;box-sizing:border-box';
      var title = document.createElement('h1');
      title.textContent = 'O Dietary não iniciou corretamente';
      title.style.cssText = 'font-size:22px;margin:0 0 12px';
      var body = document.createElement('p');
      body.textContent = 'A tela de recuperação apareceu porque a inicialização demorou ou falhou. Copie o detalhe abaixo para podermos corrigir o problema.';
      body.style.cssText = 'font-size:14px;line-height:1.55;color:#52685a;margin:0 0 12px';
      var detail = document.createElement('pre');
      detail.textContent = String(message || 'Tempo de inicialização excedido');
      detail.style.cssText = 'white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f4ed;padding:12px;border-radius:10px;font-size:12px;max-height:28vh;overflow:auto';
      var btn = document.createElement('button');
      btn.textContent = 'Recarregar app';
      btn.style.cssText = 'width:100%;border:0;border-radius:12px;padding:14px;background:#527a61;color:#fff;font-weight:bold;font-size:15px;margin-top:12px';
      btn.onclick = function () { location.reload(); };
      card.appendChild(title); card.appendChild(body); card.appendChild(detail); card.appendChild(btn);
      panel.appendChild(card); document.body.appendChild(panel);
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showRecovery((e.message || 'Erro JavaScript') + (e.filename ? ' — ' + e.filename.split('/').pop() : '') + (e.lineno ? ':' + e.lineno : ''));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showRecovery('Falha assíncrona: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason || 'erro desconhecido')));
  });
  window.setTimeout(function () {
    var app = document.getElementById('app');
    var splash = document.getElementById('splash');
    var welcome = document.getElementById('welcome');
    var qwrap = document.getElementById('qwrap');
    var appVisible = app && getComputedStyle(app).display !== 'none' && app.getBoundingClientRect().height > 0;
    var welcomeVisible = welcome && getComputedStyle(welcome).display !== 'none' && welcome.getBoundingClientRect().height > 0;
    var qVisible = qwrap && getComputedStyle(qwrap).display !== 'none' && qwrap.getBoundingClientRect().height > 0;
    if (!appVisible && !welcomeVisible && !qVisible) {
      if (splash) splash.style.display = 'none';
      showRecovery('O app não exibiu nenhuma tela após 12 segundos. Reabra o arquivo no Chrome e, se persistir, envie esta mensagem.');
    }
  }, 12000);
})();
</script>
<script>/* V10: recuperação visível de falhas de inicialização para evitar tela branca */
(function(){
  function showBootError(message){
    try {
      let panel=document.getElementById('dietary-boot-error');
      if(!panel){
        panel=document.createElement('div'); panel.id='dietary-boot-error';
        panel.style.cssText='position:fixed;inset:0;z-index:1000000;background:#f6f9f5;color:#14231a;font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px;box-sizing:border-box;overflow:auto';
        document.body.appendChild(panel);
      }
      const safe=String(message||'Falha não identificada').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      panel.innerHTML='<div style="width:100%;max-width:440px;background:#fff;border:1px solid #dce8df;border-radius:20px;padding:24px;box-shadow:0 12px 36px rgba(0,0,0,.08)"><div style="font-size:28px;margin-bottom:10px">🌿</div><h1 style="font-size:22px;margin:0 0 10px">O Dietary encontrou um problema</h1><p style="font-size:14px;line-height:1.55;color:#486052;margin:0 0 14px">A inicialização falhou, então esta tela foi exibida no lugar da tela branca. Você pode tentar recarregar. Se continuar, envie ao suporte o código abaixo.</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5f2;padding:12px;border-radius:10px;font-size:12px;color:#7f1d1d">'+safe+'</pre><button id="dietary-reload" style="width:100%;border:0;border-radius:12px;padding:13px;background:#16803c;color:white;font-weight:700;font-size:15px;margin-top:10px">Recarregar app</button><button id="dietary-reset" style="width:100%;border:1px solid #cbd8ce;border-radius:12px;padding:12px;background:white;color:#263c2d;font-weight:600;font-size:14px;margin-top:8px">Limpar dados locais e recomeçar</button><p style="font-size:11px;line-height:1.4;color:#6b7c70;margin:12px 0 0">Limpar dados locais apaga apenas os dados deste app salvos neste navegador.</p></div>';
      const splash=document.getElementById('splash'); if(splash){splash.style.display='none';}
      const app=document.getElementById('app'); if(app)app.style.display='none';
      const welcome=document.getElementById('welcome'); if(welcome)welcome.style.display='none';
      const qwrap=document.getElementById('qwrap'); if(qwrap)qwrap.style.display='none';
      document.getElementById('dietary-reload').onclick=()=>location.reload();
      document.getElementById('dietary-reset').onclick=()=>{try{localStorage.removeItem('dietary_v3');localStorage.removeItem('dietary_v4');localStorage.removeItem('dietary_v5');localStorage.removeItem('dietary_v6');localStorage.removeItem('dietary_v7');localStorage.removeItem('dietary_v8');}catch(e){} location.reload();};
    } catch(e) { console.error('Dietary recovery screen failed',e); }
  }
  window.__dietaryShowBootError=showBootError;
  window.addEventListener('error',function(e){showBootError((e.message||'Erro JavaScript')+(e.filename?' — '+e.filename.split('/').pop():'')+(e.lineno?':'+e.lineno:''));});
  window.addEventListener('unhandledrejection',function(e){showBootError('Falha assíncrona: '+(e.reason?.message||e.reason||'erro desconhecido'));});

function sanitizeHistory(h){
  // Mantém só dias no formato esperado; um dia corrompido é descartado sem levar junto o histórico inteiro.
  const out={};
  if(!h||typeof h!=='object'||Array.isArray(h)) return out;
  for(const [k,v] of Object.entries(h)){
    if(!v||typeof v!=='object'||Array.isArray(v)) continue;
    const meals=(v.meals&&typeof v.meals==='object'&&!Array.isArray(v.meals))?v.meals:{};
    out[k]=Object.assign({},v,{meals});
  }
  return out;
}

/* ====== CÁLCULOS NUTRICIONAIS ====== */
/* Faixas de validação fisiológica */
const VALID_RANGES = {
  age:    {min:5,   max:110, label:'idade'},
  weight: {min:15,  max:400, label:'peso'},
  height: {min:90,  max:280, label:'altura'},
};

function validateProfile(p){
  const errs=[];
  for(const [field,range] of Object.entries(VALID_RANGES)){
    const v=p[field];
    if(v!==null&&v!==undefined){
      if(v<range.min||v>range.max)
        errs.push(`${range.label} fora do intervalo (${range.min}–${range.max})`);
    }
  }
  return errs;
}

function calcBMR(p){
  if(!p.age||!p.weight||!p.height) return null;
  // Não usar equação adulta para estimar necessidades de menores de 18 anos.
  if(Number(p.age)<18) return null;
  if(!['male','female'].includes(p.gender)) return null;
  const errs=validateProfile(p);
  if(errs.length) return null; // valores impossíveis → não calcular
  const b=(10*p.weight)+(6.25*p.height)-(5*p.age);
  return Math.round(p.gender==='male'?b+5:b-161);
}

function calcTDEE(bmr,act){
  return Math.round(bmr*({sedentary:1.2,light:1.375,moderate:1.55,active:1.725,veryactive:1.9}[act]||1.55));
}

function calcMacros(p){
  // Esta versão não calcula metas energéticas/macros individuais para menores de 18 anos.
  // Para adultos, a estimativa usa Mifflin–St Jeor e fator de atividade; não é prescrição clínica.
  if(!p || Number(p.age)<18) return null;
  const bmr=calcBMR(p);
  if(!bmr) return null;
  const tdee=calcTDEE(bmr,p.activity);
  const goalAdjust={lose:-400,maintain:0,gain:250};
  const cal=tdee+(goalAdjust[p.goal]??0);
  const proteinFactor={lose:1.6,maintain:1.2,gain:1.8};
  const prot=Math.round(p.weight*(proteinFactor[p.goal]??1.2));
  const fat=Math.round(cal*0.25/9);
  const carb=Math.round((cal-(prot*4)-(fat*9))/4);
  if(!Number.isFinite(cal)||!Number.isFinite(prot)||cal<=0||carb<0) return null;
  return {bmr,tdee,calories:Math.round(cal),protein:prot,carbs:carb,fat,isEstimate:true,method:'Mifflin–St Jeor + fator de atividade; estimativa para adultos'};
}

  if(S.dark) document.documentElement.setAttribute('data-dark','');
  else document.documentElement.removeAttribute('data-dark');

  const done=req.filter(id=>meals[id]&&meals[id].done).length;
  return{done,total:req.length,pct:req.length?Math.round(done/req.length*100):0};
}

function prevItems(meal,ms){
  let items=[];
  if(meal.type==='simple'||meal.type==='optional'){items=meal.items.slice(0,3).map(i=>`${i.e} ${i.n}`)}
  else if(meal.type==='lunch'){

    else{items=meal.base.map(i=>`${i.e} ${i.n}`);if(ms.prot){const p=meal.proteins.find(p=>p.id===ms.prot);if(p)items.push(`${p.e} ${p.n}`)}else items.push('Escolha a proteína')}
  }else if(meal.type==='options'){
    if(ms.opt){const opt=meal.options.find(o=>o.id===ms.opt);if(opt){const it=opt.items||opt.base||[];items=it.slice(0,3).map(i=>`${i.e} ${i.n}`);if(opt.sub==='protein'&&ms.prot){const p=opt.proteins?.find(p=>p.id===ms.prot);if(p)items.push(`${p.e} ${p.n}`)}}}
    else items=['Escolha uma opção']
  }
  (ms.extras||[]).forEach(ex=>items.push(`${ex.e||'✏️'} ${ex.n}`));
  return items.slice(0,5);
}

/* Calcula kcal (e opcionalmente macros) a partir de porções */
function calcPortionKcal(portions){
  if(!portions||!portions.length) return 0;
  return Math.round(portions.reduce((sum,p)=>{
    const f=FOOD_DB[p.food];
    return sum + (f ? f.kcal*(p.g/100) : 0);
  },0));
}

function calcPortionMacros(portions){
  if(!portions||!portions.length) return {kcal:0,p:0,c:0,f:0};
  return portions.reduce((acc,p)=>{
    const f=FOOD_DB[p.food]||{kcal:0,p:0,c:0,f:0};
    const factor=p.g/100;
    return {
      kcal:acc.kcal+f.kcal*factor,
      p:acc.p+f.p*factor,
      c:acc.c+f.c*factor,
      f:acc.f+f.f*factor,
    };
  },{kcal:0,p:0,c:0,f:0});
}

function parsePortionGrams(item, defaultG){
  const q=normalizeFoodText(item?.q||'');
  const m=q.match(/(\d+(?:[.,]\d+)?)\s*(?:–|-|a)\s*(\d+(?:[.,]\d+)?)\s*(g|ml)/);
  if(m) return (parseFloat(m[1].replace(',','.'))+parseFloat(m[2].replace(',','.')))/2;
  const one=q.match(/(\d+(?:[.,]\d+)?)\s*(g|ml)/);
  if(one) return parseFloat(one[1].replace(',','.'));
  const units=q.match(/(\d+)\s*(?:unidade|unidades|un\b)/);
  if(units) return parseInt(units[1],10)*defaultG;
  return defaultG;
}
function estimateFoodItem(item){
  const label=normalizeFoodText(item?.n||'');
  if(!label || /nenhuma opcao|revise suas|escolha uma base|opcoes precisam/.test(label)) return {known:false};
  // Não inferir composição de receitas, alimentos crus/farinhas ou rótulos vagos.
  if(/pao.*ovo|vitamina|lasanha|strogonoff|ensopado|churrasco|macarrao especial|fruta de sua preferencia|fruta \(|legumes variados|salada|\bcru\b|farinha|po de|em po|frito|empanado|ao molho|com molho/.test(label)) return {known:false};
  let match=null;
  for(const row of FOOD_MATCHERS){ if(row[0].test(label)){match=row;break;} }
  if(!match) return {known:false};
  const [,food,unitG,assumedPreparation=false]=match;
  let grams=parsePortionGrams(item,unitG);
  // For single egg labels and bread labels, use familiar edible-portion estimates.
  if(/ovo/.test(label) && /2|3/.test(normalizeFoodText(item?.q||'')) && !/g|ml/.test(normalizeFoodText(item?.q||''))) grams=100;
  const data=FOOD_DB[food]; if(!data) return {known:false};
  const factor=grams/100;
  return {known:true,food,grams,assumedPreparation,kcal:data.kcal*factor,p:data.p*factor,c:data.c*factor,f:data.f*factor};
}
function selectedItemsForMeal(meal, ms={}, useDefault=false){
  if(meal.type==='simple'||meal.type==='optional') return meal.optional&&!useDefault?[]:(meal.items||[]);
  if(meal.type==='lunch'){
    if(ms.spec){const sp=(meal.specials||[]).find(x=>x.id===ms.spec);if(sp)return sp.items||[];}
    const protein=(meal.proteins||[]).find(x=>x.id===ms.prot)||(useDefault?(meal.proteins||[])[0]:null);
    return [...(meal.base||[]),...(protein?[protein]:[])];
  }
  if(meal.type==='options'){
    const opt=(meal.options||[]).find(x=>x.id===ms.opt)||(useDefault?(meal.options||[])[0]:null);
    if(!opt)return [];
    const items=[...(opt.items||opt.base||[])];
    if(opt.sub==='protein'){
      const protein=(opt.proteins||[]).find(x=>x.id===ms.prot)||(useDefault?(opt.proteins||[])[0]:null);
      if(protein)items.push(protein);
    }
    return items;
  }
  return [];
}
function estimateNutrition(items){
  const entries=(items||[]).map(estimateFoodItem); const known=entries.filter(x=>x.known);
  const total=known.reduce((a,x)=>({kcal:a.kcal+x.kcal,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{kcal:0,p:0,c:0,f:0});
  const macroKcal=(total.p*4)+(total.c*4)+(total.f*9);
  const assumedCount=known.filter(x=>x.assumedPreparation).length;
  const kcalDeltaPct=total.kcal>0?Math.round(Math.abs(macroKcal-total.kcal)/total.kcal*100):0;
  return {...total,macroKcal,kcalDeltaPct,knownCount:known.length,totalCount:entries.length,unknownCount:entries.length-known.length,assumedCount,coverage:entries.length?Math.round(known.length/entries.length*100):0,partial:entries.length!==known.length};
}
function estimatePlanNutrition(){
  const meals=getActiveMeals();
  const all=[]; let optionalSkipped=0;
  meals.forEach(meal=>{
    if(meal.optional){optionalSkipped++;return;}
    all.push(...selectedItemsForMeal(meal,{},true));
  });
  return estimateNutrition(all);
}

function mealKcal(mealId,ms){
  if(!ms) return 0;
  // Preferir a soma dos ingredientes selecionados quando todos forem reconhecidos.
  // Para pratos compostos/ambíguos, manter a estimativa legada em vez de fingir precisão.
  const meal=getActiveMeals().find(x=>x.id===mealId);
  if(meal && meal.type!=='optional'){
    const estimate=estimateNutrition(selectedItemsForMeal(meal,ms,true));
    if(estimate.knownCount>0 && estimate.unknownCount===0) return Math.round(estimate.kcal);
  }
  // Fallback aproximado para preparações sem composição detalhada.
  switch(mealId){
    case'cafe':
      return calcPortionKcal(MEAL_FOOD_PORTIONS.cafe);
    case'escola':
      return calcPortionKcal(MEAL_FOOD_PORTIONS.escola);
    case'almoco':
      if(ms.spec) return KCAL.specials[ms.spec]||550; // especiais mantém estimativa
      const almocoBase=calcPortionKcal(MEAL_FOOD_PORTIONS.almoco_base);
      const protAlm=MEAL_FOOD_PORTIONS.almoco_prot[ms.prot]||MEAL_FOOD_PORTIONS.almoco_prot.frango;
      return almocoBase + calcPortionKcal(protAlm);
    case'pos':
      const posMap={vita:'pos_vita',paoovo:'pos_paoovo',vitapao:'pos_vitapao'};
      const posKey=posMap[ms.opt]||'pos_vita';
      return calcPortionKcal(MEAL_FOOD_PORTIONS[posKey]||MEAL_FOOD_PORTIONS.pos_vita);
    case'jantar':
      if(ms.opt==='macfr'||ms.opt==='mac_frango')
        return calcPortionKcal(MEAL_FOOD_PORTIONS.jantar_macfr);
      const jantarBase=calcPortionKcal(MEAL_FOOD_PORTIONS.jantar_base);
      const protJan=MEAL_FOOD_PORTIONS.jantar_prot[ms.prot]||MEAL_FOOD_PORTIONS.jantar_prot.frango;
      return jantarBase + calcPortionKcal(protJan);
    case'ceia':
      return calcPortionKcal(MEAL_FOOD_PORTIONS.ceia);
    default: return 0;
  }
}

function estMealKcal(mealId){
  const meal=getActiveMeals().find(x=>x.id===mealId);
  if(meal && meal.type!=='optional'){
    const estimate=estimateNutrition(selectedItemsForMeal(meal,{},true));
    if(estimate.knownCount>0 && estimate.unknownCount===0) return Math.round(estimate.kcal);
  }
  // Fallback aproximado para pratos/itens que ainda não têm composição calculável.
  const portions={
    cafe:     MEAL_FOOD_PORTIONS.cafe,
    escola:   MEAL_FOOD_PORTIONS.escola,
    almoco:   [...MEAL_FOOD_PORTIONS.almoco_base, ...(MEAL_FOOD_PORTIONS.almoco_prot.frango||[])],
    pos:      MEAL_FOOD_PORTIONS.pos_vita,
    jantar:   [...MEAL_FOOD_PORTIONS.jantar_base, ...(MEAL_FOOD_PORTIONS.jantar_prot.frango||[])],
    ceia:     MEAL_FOOD_PORTIONS.ceia,
  };
  const base=calcPortionKcal(portions[mealId]||[]);
  return base||0;
}

function todayKcal(day){
  let tot=0;
  getActiveMeals().forEach(m=>{
    const ms=day.meals[m.id];
    if(ms?.done) tot+=mealKcal(m.id,ms);
  });
  return tot;
}

let _sample = null;
async function getSample(){
  if(_sample!==null)return _sample;
  try{_sample=await window.claude.use('sample')||false;}catch(e){_sample=false;}
  return _sample;
}

async function aiSend(){
  const inp=document.getElementById('aiinp');const txt=inp.value.trim();if(!txt)return;
  stopListening();
  inp.value='';inp.style.height='auto';
  S.aiMsgs.push({r:'user',c:h(txt)});
  renderAIMsgs(true);

  const av=`<div style="width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--g),#4ADE80);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0">🌿</div>`;

  try{
    const sample=await getSample();
    if(!sample)throw{code:'unavailable'};

    const sys=buildSys();
    const prev=S.aiMsgs.slice(0,-1);
    const clean=(m)=>m.c.replace(/<br>/g,'\n').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
    let turns;

    if(prev.length===0){
      turns=[{role:'user',content:sys+'\n\n---\n\n'+txt}];
    }else{
      turns=[{role:'user',content:sys+'\n\n---\n\n'+clean(prev[0])}];
      for(let i=1;i<prev.length;i++)turns.push({role:prev[i].r==='user'?'user':'assistant',content:clean(prev[i])});
      turns.push({role:'user',content:txt});
    }

    let started=false;
    const result=await sample(turns,{
      modelTier:'default',
      onText:({text})=>{
        if(!started){
          started=true;
          const typ=document.querySelector('.typ');
          if(typ){
            const b=document.createElement('div');
            b.className='msg a';b.id='sbbl';
            b.innerHTML=text.replace(/\n/g,'<br>')+'<span class="tcur">▌</span>';
            typ.replaceWith(b);
          }
        }else{
          const b=document.getElementById('sbbl');
          if(b)b.innerHTML=text.replace(/\n/g,'<br>')+'<span class="tcur">▌</span>';
        }
        const c=document.getElementById('cnt');if(c)c.scrollTop=c.scrollHeight;
      }
    });

    S.aiMsgs.push({r:'ai',c:(result.text||'').trim()});

  }catch(e){
    if(e?.code==='cancelled'){renderAIMsgs(false);return;}
    let msg='😅 Algo deu errado. Tente novamente!';
    if(e?.code==='not_granted')msg='🔒 Toque em "Permitir" quando solicitado para ativar a Bia.';
    else if(e?.code==='rate_limited')msg='⏱️ Muitas perguntas seguidas! Aguarde um momento e tente de novo.';
    else if(e?.code==='unavailable')msg='😕 A IA está indisponível neste momento. Recarregue a página.';
    S.aiMsgs.push({r:'ai',c:msg});
  }
  renderAIMsgs(false);
}

function aiChip(txt){document.getElementById('aiinp').value=txt;aiSend()}

/* ====== VOZ ====== */
let recog=null;let isListening=false;

function initSpeech(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR)return null;
  const r=new SR();
  r.lang='pt-BR';r.continuous=false;r.interimResults=true;
  r.onresult=(e)=>{
    const t=Array.from(e.results).map(r=>r[0].transcript).join('');
    const inp=document.getElementById('aiinp');
    if(inp){inp.value=t;inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,90)+'px'}
    if(e.results[e.results.length-1].isFinal){stopListening();setTimeout(()=>aiSend(),300)}
  };
  r.onerror=(e)=>{
    stopListening();
    if(e.error==='not-allowed'||e.error==='permission-denied'){
      S.aiMsgs.push({r:'ai',c:'🎤 Para usar a voz, permita o acesso ao microfone nas configurações do seu navegador.'});
      renderAIMsgs(false);
    }
  };
  r.onend=()=>stopListening();
  return r;
}

function toggleVoice(){isListening?stopListening():startListening()}

function startListening(){
  if(!recog)recog=initSpeech();
  if(!recog){
    S.aiMsgs.push({r:'ai',c:'😕 Seu navegador não suporta reconhecimento de voz. Tente pelo Chrome ou Safari.'});
    renderAIMsgs(false);return;
  }
  try{
    isListening=true;
    recog.start();
    document.getElementById('mic-btn').classList.add('listening');
    document.getElementById('voice-status').classList.add('on');
    document.getElementById('aiinp').placeholder='Ouvindo…';
  }catch(e){stopListening()}
}

function stopListening(){
  isListening=false;
  try{recog?.stop()}catch(e){}
  const mb=document.getElementById('mic-btn');
  const vs=document.getElementById('voice-status');
  const inp=document.getElementById('aiinp');
  if(mb)mb.classList.remove('listening');
  if(vs)vs.classList.remove('on');
  if(inp)inp.placeholder='Pergunte sobre sua dieta…';
}

function renderProgress(){
  document.getElementById('hdr').innerHTML=`<div class="greet" style="font-size:20px;letter-spacing:-.3px">Progresso</div><div class="gdt">Sua consistência alimentar</div>`;
  const keys=Object.keys(S.history);const todK=todayK();
  const totalDays=keys.length;
  const totalMeals=keys.reduce((a,k)=>a+Object.values(S.history[k].meals).filter(m=>m.done).length,0);
  let streak=0;{let d=new Date();for(let i=0;i<365;i++){const k=d.toISOString().slice(0,10);const dy=S.history[k];if(!dy)break;const req=getActiveMeals().filter(m=>!m.optional).map(m=>m.id);const all=req.every(id=>dy.meals[id]?.done);if(!all&&k!==todK)break;if(all)streak++;d.setDate(d.getDate()-1)}}
  const days=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const weekH=Array.from({length:7},(_,i)=>{
    const dt=new Date();dt.setDate(dt.getDate()-(6-i));const k=dt.toISOString().slice(0,10);const isT=k===todK;
    const dy=S.history[k];let cls='';
    if(dy){const req=getActiveMeals().filter(m=>!m.optional).map(m=>m.id);const done=req.filter(id=>dy.meals[id]?.done).length;if(done===req.length)cls='full';else if(done>0)cls='has'}
    if(isT)cls+=' today';
    return`<div class="wd"><div class="wdl">${days[dt.getDay()]}</div><div class="wdd ${cls}">${dt.getDate()}</div></div>`;
  }).join('');
  const cons=totalDays>0?Math.min(100,Math.round(totalMeals/(totalDays*5)*100)):0;
  document.getElementById('cnt').innerHTML=`<div class="ti">
    ${streak>=3?`<div class="streak-box"><div class="sb-ico">🔥</div><div><div class="sb-t">${streak} dias seguidos!</div><div class="sb-s">Incrível! Continue assim</div></div></div>`:''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px">
      <div class="card sc" style="background:linear-gradient(135deg,var(--gl),var(--sf))"><div class="sv">${totalDays}</div><div class="sl">Dias registrados</div></div>
      <div class="card sc" style="background:linear-gradient(135deg,var(--sf),var(--sf2))"><div class="sv">${totalMeals}</div><div class="sl">Refeições concluídas</div></div>
      <div class="card sc" style="background:linear-gradient(135deg,#FFF7ED,var(--sf))"><div class="sv" style="color:#D97706">${streak}</div><div class="sl">Sequência atual</div></div>
      <div class="card sc" style="background:linear-gradient(135deg,var(--sf2),var(--sf))"><div class="sv">${cons}%</div><div class="sl">Consistência</div></div>
    </div>
    <div class="card wcrd">
      <div class="wt">Últimos 7 dias</div>
      <div class="wdg">${weekH}</div>
      <div style="display:flex;gap:12px;margin-top:12px;font-size:11px;color:var(--t3);">
        <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--g);display:inline-block"></span>Completo</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--gl);display:inline-block"></span>Parcial</span>
        <span style="display:flex;align-items:center;gap:5px"><span style="width:10px;height:10px;border-radius:50%;background:var(--sf2);display:inline-block"></span>Nenhuma</span>
      </div>
    </div>
    <div style="height:6px"></div></div>`;
}

/* ====== SETTINGS ====== */

    </div>
    <div class="srow" style="cursor:default">
      <span class="si">📏</span><span class="slb">Altura</span>

  <div class="ssec"><div class="sstl">Preferências alimentares</div>
  <div class="card scrd">
    ${prefs.map(([k,e,n])=>`<div class="srow" onclick="togglePref('${k}')">
      <span class="si">${e}</span><span class="slb">${n}</span>
      <label class="tgl" onclick="event.stopPropagation()">
        <input type="checkbox" ${p.prefs[k]?'checked':''} onchange="togglePref('${k}')"><div class="tsl"></div>
      </label></div>`).join('')}

  if(m){
    html+=`<div class="ssec"><div class="sstl">Estimativa de metas nutricionais 📊</div>
    <div class="card" style="padding:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">

      <div class="notebox" style="margin-top:10px">🤖 Esses são valores estimados com base nas suas informações. <b>Consulte a Bia</b> para adaptar sua dieta atual a esses objetivos!</div>

  } else if (profileErrs.length) {

  } else {
    const faltam=['age','weight','height'].filter(k=>!p[k]).map(k=>({age:'idade',weight:'peso',height:'altura'})[k]);

    </div>
  </div></div>

  <div class="ssec"><div class="sstl">Rotina e apresentação</div>
    <div class="card scrd">
      <div class="srow" onclick="editRoutine()"><span class="si">🕒</span><span class="slb">Editar estudo, trabalho e horários das refeições</span><span class="sval">›</span></div>

    </div>
  </div>

  <div class="ssec"><div class="sstl">Sobre</div>

    <div class="srow" style="cursor:default"><span class="si">📅</span><span class="slb">Dias registrados</span><span class="sval">${Object.keys(S.history).length}</span></div>
  </div></div>

  <div class="ssec"><div class="card scrd">
    <div class="srow" onclick="confirmReset()"><span class="si">🗑️</span><span class="slb" style="color:#EF4444">Limpar dados / Recomeçar</span></div>
  </div></div>
  <div style="height:8px"></div></div>`;

  document.getElementById('cnt').innerHTML=html;
}

function setProp(k,v){
  const wasKey = ['goal','activity'].includes(k);
  S.profile[k]=v;
  save();
  renderSettings();
  // Se meta ou atividade mudou e há plano personalizado, invalidar
  if(wasKey && S.personalMeals && S.q?.done){
    S._planOutdated=true;
  }
}
function setNum(k,v){
  const num = v ? parseFloat(v) : null;
  // Validar faixa antes de salvar
  if(num !== null && VALID_RANGES[k]){
    const r = VALID_RANGES[k];
    if(num < r.min || num > r.max){
      // Valor fora da faixa: salvar null (campo inválido)
      S.profile[k] = null;
      save();
      setTimeout(()=>renderSettings(), 400);
      return;
    }
  }
  S.profile[k] = num;
  save();
  setTimeout(()=>{ renderSettings(); }, 600);
}
function togglePref(k){S.profile.prefs[k]=!S.profile.prefs[k];save();renderSettings()}
function replayWelcome(){
  S._welcomeReplay=!!S.q?.done;
  const wl=document.getElementById('welcome');
  if(wl){wl.classList.remove('wl-hidden','wl-out','wl-animating','wl-float-on');void wl.offsetWidth;showWelcome();}
}
function editRoutine(){
  if(!S.q)S.q={done:true,step:10};
  Object.assign(S.q,{dayRole:S.q.dayRole||'neither',wakeTime:S.q.wakeTime||'07:00',sleepTime:S.q.sleepTime||'22:00',studyStart:S.q.studyStart||'08:00',studyEnd:S.q.studyEnd||'12:00',workStart:S.q.workStart||'09:00',workEnd:S.q.workEnd||'17:00'});
  S.q.done=false; S.q.step=10;
  const qw=document.getElementById('qwrap');
  if(qw){qw.style.display='flex';qw.classList.remove('out');}
  renderQStep(10);
}
function toggleDark(v){S.dark=!!v;applyTheme();save();if(S.tab==='cfg')renderSettings()}
function confirmReset(){
  // Diálogo próprio: cada ação tem seu botão e "Cancelar" realmente cancela.
  // (Antes um confirm() usava OK/Cancelar para DUAS ações destrutivas diferentes, sem saída segura.)
  const nDias=Object.keys(S.history||{}).length;
  const temPerfil=!!(S.profile&&(S.profile.age||S.profile.weight||S.profile.height))||!!(S.q&&S.q.done);
  let ov=document.getElementById('bia-reset-ov');
  if(!ov){ov=document.createElement('div');ov.id='bia-reset-ov';document.body.appendChild(ov);}
  ov.innerHTML=`<div class="brs-bx" role="dialog" aria-modal="true" aria-labelledby="brs-t">
    <div class="brs-t" id="brs-t">Limpar dados</div>
    <div class="brs-s">Estes dados ficam somente neste aparelho, dentro do navegador. O Dietary não tem conta nem servidor: não há nada para excluir fora daqui.</div>
    <button class="brs-b" onclick="biaResetHist()">
      <b>Limpar só o histórico</b>
      <span>Apaga ${nDias} dia(s) de refeições marcadas e as conversas com a Bia. Mantém seu perfil e sua dieta.</span></button>
    <button class="brs-b brs-d" onclick="biaResetTudo()">
      <b>Apagar tudo e recomeçar</b>
      <span>${temPerfil?'Apaga também o perfil, o questionário e a dieta montada. Volta ao início.':'Volta o app ao estado inicial.'}</span></button>
    <button class="brs-c" onclick="biaResetFechar()">Cancelar</button>
  </div>`;
  ov.classList.add('on');
}
function biaResetFechar(){const o=document.getElementById('bia-reset-ov');if(o)o.classList.remove('on');}
function biaResetHist(){
  if(!confirm('Apagar o histórico de refeições e as conversas com a Bia? Seu perfil e sua dieta serão mantidos.')) return;
  S.history={};S.aiMsgs=[];
  try{localStorage.removeItem('bia_chats_v1');window.biaChatsReset&&window.biaChatsReset();}catch(e){}
  save();biaResetFechar();renderSettings();renderToday();
  alert('Histórico e conversas apagados. Seu perfil foi mantido.');
}
function biaResetTudo(){
  if(!confirm('Apagar TODOS os dados do Dietary neste aparelho (perfil, questionário, dieta, histórico e conversas)? Essa ação não pode ser desfeita.')) return;
  S.history={};S.aiMsgs=[];S.q=null;S.personalMeals=null;S.personName='';S._planOutdated=false;
  S.profile={gender:'male',age:null,weight:null,height:null,
    activity:'moderate',goal:'maintain',
    prefs:{vegetables:true,fruits:true,eggs:true,meat:true,fish:true,dairy:true,legumes:true}};
  try{ localStorage.removeItem('dietary_v3');localStorage.removeItem('bia_chats_v1');window.biaChatsReset&&window.biaChatsReset(); }catch(e){}
  save();biaResetFechar();
  const qw=document.getElementById('qwrap');
  if(qw){qw.style.display='flex';qw.classList.remove('out');}
  renderQStep(0);renderToday();goTab('today');
}

/* ====== SHEET ====== */
function openSheet(mealId){
  const day=todayD();const ms=day.meals[mealId]||{};
  sh={meal:mealId,step:'main',prot:ms.prot,opt:ms.opt,spec:ms.spec,adding:false};
  document.getElementById('ov').classList.add('on');
  document.getElementById('sh').classList.add('on');
  renderSheet();
}
function closeSheet(){document.getElementById('ov').classList.remove('on');document.getElementById('sh').classList.remove('on');sh.meal=null;if(S.tab==='today')renderToday();}

function foodRows(items){return items.map(i=>`<div class="frow"><div class="fi">${i.e}</div><div class="fn">${i.n}</div><div class="fq">${i.q}</div></div>`).join('')}

function renderSheet(){
  if(!sh.meal)return;
  const meal=getActiveMeals().find(m=>m.id===sh.meal);
  const day=todayD();const ms=day.meals[sh.meal]||{};
  const titleH=`<div class="sh-tr"><div class="sh-ic">${meal.emoji}</div><div><div class="sh-ti">${meal.name}</div><div class="sh-su">${meal.time}</div></div></div>`;
  let html='';

  if(meal.type==='simple'){
    html=titleH+foodRows(meal.items);
    html+=extrasHtml(meal.id);
    html+=ms.done?`<button class="bu" onclick="undoM('${meal.id}')">↩ Desfazer conclusão</button>`:`<button class="bm" onclick="doneSimple('${meal.id}')">✓ Concluir ${meal.name}</button>`;
  }

  else if(meal.type==='optional'){
    html=titleH+`<div class="orbox">⚠️ ${meal.note} — escolha qualquer opção abaixo</div>`;
    html+=meal.items.map(i=>`<div class="frow"><div class="fi">${i.e}</div><div class="fn">${i.n}</div><div class="fq">${i.q}</div></div>`).join('');
    html+=extrasHtml(meal.id);
    html+=ms.done?`<button class="bu" onclick="undoM('${meal.id}')">↩ Desfazer</button>`:`<button class="bm" onclick="doneSimple('${meal.id}')">✓ Concluir Ceia</button>`;
  }

  else if(meal.type==='lunch'){
    if(sh.step==='specials'){
      html=titleH+`<button class="bkbtn" onclick="sh.step='main';sh.spec=null;renderSheet()">← Voltar</button>`;
      html+=`<div class="orbox" style="background:var(--orl)">⭐ Use quando a comida em casa for diferente do almoço padrão.</div>`;
      meal.specials.forEach(sp=>{
        const sel=sh.spec===sp.id;
        html+=`<div class="spc ${sel?'sel':''}" onclick="togSpec('${sp.id}')">
          <div class="spc-h"><span>${sp.e}</span><span class="spc-n">${sp.n}</span></div>
          <div class="spc-it">${sp.items.map(i=>`${i.e} ${i.n}: ${i.q}`).join(' · ')}</div>
        </div>`;
      });
      if(sh.spec)html+=`<button class="bm" onclick="doneLunch()">✓ Concluir Almoço</button>`;
    }else{
      html=titleH+`<div class="slbl">Base</div>`+foodRows(meal.base);
      if(sh.spec){
        const sp=meal.specials.find(s=>s.id===sh.spec);
        html+=`<div class="slbl">Refeição especial selecionada ⭐</div>`+foodRows(sp.items);
        html+=`<div class="sptgl" onclick="sh.spec=null;renderSheet()"><span>✕ Remover especial — usar padrão</span></div>`;
      }else{
        html+=`<div class="slbl">Proteína</div><div class="pgrid">`;
        meal.proteins.forEach(p=>{const sel=sh.prot===p.id;html+=`<div class="oc ${sel?'sel':''}" onclick="selP('almoco_prot','${p.id}')"><div class="oc-i">${p.e}</div><div class="oc-n">${p.n}</div><div class="oc-q">${p.q}</div></div>`});
        html+=`</div><div class="sptgl" onclick="sh.step='specials';sh.spec=null;renderSheet()"><span>⭐ Refeição especial hoje?</span><span class="spar">▼</span></div>`;
      }
      const can=sh.prot||sh.spec;
      html+=extrasHtml(meal.id);
      html+=ms.done?`<button class="bu" onclick="undoM('${meal.id}')">↩ Desfazer</button>`:`<button class="bm" onclick="doneLunch()" ${!can?'disabled':''}>✓ Concluir Almoço</button>`;
    }
  }

  else if(meal.type==='options'){
    if(sh.opt===null){
      html=titleH+`<div class="slbl">Escolha uma opção</div>`;
      meal.options.forEach(opt=>{
        const itms=opt.items||opt.base||[];const prev=itms.slice(0,3).map(i=>`${i.e} ${i.n}`).join(' · ');
        html+=`<div class="fwoc" onclick="selOpt('${meal.id}','${opt.id}')"><div class="fwoc-i">${opt.e}</div><div><div class="fwoc-n">${opt.n}</div><div class="fwoc-s">${prev}</div></div></div>`;
      });
    }else{
      const opt=meal.options.find(o=>o.id===sh.opt);
      html=titleH+`<button class="bkbtn" onclick="sh.opt=null;sh.prot=null;renderSheet()">← Trocar opção</button>`;
      if(opt.sub==='protein'){
        html+=foodRows(opt.base)+`<div class="slbl">Proteína</div><div class="pgrid">`;
        opt.proteins.forEach(p=>{const sel=sh.prot===p.id;html+=`<div class="oc ${sel?'sel':''}" onclick="selP('opt_prot','${p.id}')"><div class="oc-i">${p.e}</div><div class="oc-n">${p.n}</div><div class="oc-q">${p.q}</div></div>`});
        html+=`</div>`;
        const can=!!sh.prot;
        html+=extrasHtml(meal.id);
        html+=ms.done?`<button class="bu" onclick="undoM('${meal.id}')">↩ Desfazer</button>`:`<button class="bm" onclick="doneOpt('${meal.id}')" ${!can?'disabled':''}>✓ Concluir ${meal.name}</button>`;
      }else{
        html+=foodRows(opt.items);
        html+=extrasHtml(meal.id);
        html+=ms.done?`<button class="bu" onclick="undoM('${meal.id}')">↩ Desfazer</button>`:`<button class="bm" onclick="doneOpt('${meal.id}')">✓ Concluir ${meal.name}</button>`;
      }
    }
  }

  document.getElementById('shb').innerHTML=html+'<div style="height:16px"></div>';
}

function selP(ctx,id){sh.prot=sh.prot===id?null:id;renderSheet()}
function selOpt(mId,oId){sh.opt=oId;sh.prot=null;renderSheet()}
function togSpec(id){sh.spec=sh.spec===id?null:id;renderSheet()}

const EPICKS=['🍎','🍊','🍋','🍌','🍇','🍓','🥝','🥑','🍳','🧀','🥛','🍞','🥩','🍗','🐟','🫐','🥕','🥦','🍚','🍝','🥤','☕','🧃','🥜','🫘','🌽','🍠','🥔','🥣','🫙','🥗','🌮'];

function extrasHtml(mealId){
  const day=todayD();const extras=(day.meals[mealId]?.extras||[]);
  let h='';
  if(extras.length>0){
    h+=`<div class="slbl" style="margin-top:14px">Adicionado por você</div>`;
    h+=extras.map((ex,i)=>`<div class="ext-row"><div class="fi">${ex.e||'✏️'}</div><div class="fn">${ex.n}</div><div class="fq">${ex.q}</div><button class="ext-del" onclick="delExtra('${mealId}',${i})">✕</button></div>`).join('');
  }
  if(sh.adding){
    h+=`<div class="add-form">
      <div class="slbl" style="margin:0 0 10px">Adicionar alimento</div>
      <div class="add-row">
        <input id="aef" class="ae-i" type="text" placeholder="🍎" maxlength="2">
        <input id="afn" class="ae-n" type="text" placeholder="Nome do alimento" autocomplete="off">
        <input id="afq" class="ae-q" type="text" placeholder="Qtd." autocomplete="off">

      <div style="display:flex;gap:8px">
        <button class="add-sv" onclick="saveExtra('${mealId}')">+ Adicionar</button>
        <button class="add-cv" onclick="sh.adding=false;renderSheet()">Cancelar</button>
      </div>
    </div>`;
  }else{
    h+=`<button class="add-btn" onclick="sh.adding=true;renderSheet()">+ Adicionar alimento extra</button>`;
  }
  return h;
}

function picEmoji(e){const el=document.getElementById('aef');if(el){el.value=e;el.focus()}}

function saveExtra(mealId){
  const e=document.getElementById('aef')?.value?.trim()||'✏️';
  const n=document.getElementById('afn')?.value?.trim();
  const q=document.getElementById('afq')?.value?.trim()||'';
  if(!n){document.getElementById('afn')?.focus();return}
  const day=todayD();
  if(!day.meals[mealId].extras)day.meals[mealId].extras=[];
  day.meals[mealId].extras.push({e,n,q});
  save();sh.adding=false;renderSheet();
}

function delExtra(mealId,idx){
  const day=todayD();
  if(day.meals[mealId]?.extras)day.meals[mealId].extras.splice(idx,1);
  save();renderSheet();
}

function doneSimple(id){const d=todayD();d.meals[id].done=true;save();closeSheet();renderToday()}

function doneOpt(id){const d=todayD();d.meals[id].done=true;d.meals[id].opt=sh.opt;d.meals[id].prot=sh.prot;save();closeSheet();renderToday()}
function undoM(id){const d=todayD();d.meals[id]={done:false,prot:null,opt:null,spec:null};save();closeSheet();renderToday()}

}

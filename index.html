function qStep13(){
  document.getElementById('qskp').style.visibility='hidden';
  // Sincroniza com S.profile
  if(S.q.gender) S.profile.gender=S.q.gender;
  if(S.q.age)    S.profile.age=S.q.age;
  if(S.q.height) S.profile.height=S.q.height;
  if(S.q.weight) S.profile.weight=S.q.weight;
  if(S.q.goal)   S.profile.goal=S.q.goal==='veryactive'?'gain':S.q.goal;
  if(S.q.activity){
    const aMap={sedentary:'sedentary',light:'light',moderate:'moderate',active:'active',veryactive:'veryactive'};
    S.profile.activity=aMap[S.q.activity]||'moderate';
  }
  // Preferências
  S.profile.prefs.eggs     = S.q.eggs!==false && S.q.diet!=='vegan';
  S.profile.prefs.meat     = !['vegetarian','vegan'].includes(S.q.diet) && S.q.beef!==false;
  S.profile.prefs.fish     = !['vegetarian','vegan'].includes(S.q.diet) && S.q.fish!==false;
  S.profile.prefs.dairy    = S.q.diet!=='vegan' && S.q.dairy!==false && !S.q.lactose;
  S.profile.prefs.vegetables = S.q.veggies!==false;
  S.profile.prefs.fruits   = S.q.fruits!==false;
  S.profile.prefs.legumes  = S.q.beans!==false;

  const m = calcMacros(S.profile);
  const goalLbl={lose:'Emagrecer',maintain:'Manter peso',gain:'Ganhar massa',health:'Melhorar alimentação',sport:'Desempenho esportivo',organize:'Organizar refeições'};
  const actLbl={sedentary:'Sedentário',light:'Levemente ativo',moderate:'Moderadamente ativo',active:'Muito ativo',veryactive:'Atleta'};
  const dietLbl={omnivore:'Onívoro',vegetarian:'Vegetariano',vegan:'Vegano',other:'Outro'};
  const budgetLbl={low:'Econômico',medium:'Médio',high:'Sem restrição'};

  const nome = S.q.name ? `, ${S.q.name}` : '';

  const restrictions=[];
  if(S.q.lactose) restrictions.push('Intolerância à lactose');
  if(S.q.gluten) restrictions.push('Glúten');
  if(S.q.nuts_allergy) restrictions.push('Alergia a castanhas');
  if(S.q.seafood_allergy) restrictions.push('Alergia a frutos do mar');
  if(S.q.other_restriction) restrictions.push(S.q.other_restriction);

  document.getElementById('qbody').innerHTML=`
    <div class="qtag">Tudo pronto!</div>
    <div class="qtitle">Seu perfil${nome} 🎉</div>
    <div class="qsub">Revise as informações abaixo. Você pode editar qualquer coisa depois em Configurações.</div>

    ${m?`<div class="qmacros">
      <div class="qmc"><div class="qmc-v">${m.calories}</div><div class="qmc-l">kcal/dia</div></div>
      <div class="qmc"><div class="qmc-v">${m.protein}g</div><div class="qmc-l">proteína</div></div>
      <div class="qmc"><div class="qmc-v">${m.carbs}g</div><div class="qmc-l">carb.</div></div>
      <div class="qmc"><div class="qmc-v">${m.fat}g</div><div class="qmc-l">gordura</div></div>
    </div>` : ''}

    <div class="qsummary">
      ${S.q.age||S.q.weight||S.q.height?`<div class="qs-row"><span class="qs-k">Dados físicos</span><span class="qs-v">${[S.q.age?S.q.age+' anos':'',S.q.weight?S.q.weight+'kg':'',S.q.height?S.q.height+'cm':''].filter(Boolean).join(' · ')}</span></div>`:''}
      ${S.q.goal?`<div class="qs-row"><span class="qs-k">Objetivo</span><span class="qs-v">${goalLbl[S.q.goal]||S.q.goal}</span></div>`:''}
      ${S.q.activity?`<div class="qs-row"><span class="qs-k">Atividade</span><span class="qs-v">${actLbl[S.q.activity]||S.q.activity}</span></div>`:''}
      <div class="qs-row"><span class="qs-k">Alimentação</span><span class="qs-v">${dietLbl[S.q.diet]||'Onívoro'}</span></div>
      ${restrictions.length?`<div class="qs-row"><span class="qs-k">Restrições</span><span class="qs-v">${restrictions.join(', ')}</span></div>`:'<div class="qs-row"><span class="qs-k">Restrições</span><span class="qs-v">Nenhuma</span></div>'}
      <div class="qs-row"><span class="qs-k">Orçamento</span><span class="qs-v">${budgetLbl[S.q.budget||'medium']}</span></div>
      <div class="qs-row"><span class="qs-k">Preparo</span><span class="qs-v">${S.q.cookTime==='quick'?'Até 15 min':S.q.cookTime==='long'?'Mais de 30 min':'15–30 min'} · ${S.q.cooks==='self'?'preparo próprio':S.q.cooks==='family'?'família/outra pessoa':S.q.cooks==='buys'?'compra pronto':'varia'}</span></div>
      <div class="qs-row"><span class="qs-k">Acesso às refeições</span><span class="qs-v">${({home:'Em casa',packed:'Leva marmita/lanche',buy:'Compra fora',mixed:'Misto'})[S.q.mealAccess||'mixed']}</span></div>
      <div class="qs-row"><span class="qs-k">Pausa para comer</span><span class="qs-v">${({under10:'Até 10 min','10to20':'10–20 min',over20:'Mais de 20 min',unknown:'Varia / não informado'})[S.q.breakMinutes||'unknown']}</span></div>
      <div class="qs-row"><span class="qs-k">Preferências a evitar</span><span class="qs-v">${S.q.dislikedFoods?S.q.dislikedFoods.replace(/</g,'&lt;'):'Não informadas'}</span></div>

    </div>

    <div style="background:var(--gl);border-radius:14px;padding:14px 16px;font-size:13px;color:var(--gd);line-height:1.6;margin-bottom:24px;border:1px solid rgba(22,163,74,.15)">
      🤖 <b>Seu cardápio inicial está pronto.</b> A Bia cruzou sua etapa de vida, preferências, restrições, orçamento, tempo de preparo e rotina para organizar opções de refeições. As porções e valores nutricionais ainda são estimativas e não equivalem a uma prescrição individual; para necessidades clínicas, procure um nutricionista.
    </div>

    <button class="qnext" onclick="finishQ()">Começar minha dieta →</button>`;
}

function finishQ(){
  S.q.done=true;
  if(!isDemo){
    // Sincroniza profile com dados do questionário
    if(S.q.gender) S.profile.gender=S.q.gender;
    if(S.q.age)    S.profile.age=S.q.age;
    if(S.q.height) S.profile.height=S.q.height;
    if(S.q.weight) S.profile.weight=S.q.weight;
    if(S.q.goal){
      const gMap={lose:'lose',maintain:'maintain',gain:'gain',health:'maintain',sport:'maintain',organize:'maintain'};
      S.profile.goal=gMap[S.q.goal]||'maintain';
    }
    if(S.q.activity){
      const aMap={sedentary:'sedentary',light:'light',moderate:'moderate',active:'active',veryactive:'veryactive'};
      S.profile.activity=aMap[S.q.activity]||'moderate';
    }
    S.profile.prefs={
      vegetables:S.q.veggies!==false,
      fruits:S.q.fruits!==false,
      eggs:S.q.eggs!==false,
      meat:!['vegetarian','vegan'].includes(S.q.diet)&&S.q.beef!==false,
      fish:!['vegetarian','vegan'].includes(S.q.diet)&&S.q.fish!==false,
      dairy:S.q.diet!=='vegan'&&S.q.dairy!==false&&!S.q.lactose,
      legumes:S.q.beans!==false
    };
    buildPersonalizedDiet();
    save();
  }
  hideQ();
  if(isDemo){ showDemoBanner(); }

  setTimeout(()=>{ if(S.tab==='today') renderToday(); },200); // só re-renderiza se o usuário não tiver trocado de aba
}

/* Validação final das refeições geradas. O objetivo é impedir que opções
   incompatíveis com preferências e restrições sobrevivam à personalização. */
function normalizeFoodText(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function foodIsBlocked(item,q){
  const name=normalizeFoodText([item?.n,item?.q].filter(Boolean).join(' '));
  if(!name) return false;
  const has=(...terms)=>terms.some(t=>name.includes(t));
  // Preferências pessoais em campo separado de alergias/restrições médicas.
  const disliked=normalizeFoodText(q.dislikedFoods||'').split(/[,;\n]+/).map(x=>x.trim()).filter(x=>x.length>=3);
  const aliasGroups=[
    ['frango','frango','frango desfiado','frango grelhado'],['peixe','peixe','atum','sardinha','salmao'],
    ['tomate','tomate'],['cebola','cebola'],['alho','alho'],['brocolis','brocolis'],['couve flor','couve flor'],
    ['salada','salada','folhas'],['leite','leite','laticinio'],['ovo','ovo','ovos'],['feijao','feijao'],
    ['arroz','arroz'],['banana','banana'],['aveia','aveia'],['pao','pao','pao frances','pao integral'],
    ['carne bovina','carne bovina','bife','carne moida'],['carne suina','carne suina','porco','lombo','linguica'],
    ['amendoim','amendoim','pasta de amendoim'],['castanha','castanha','nozes','amendoas']
  ];
  for(const term of disliked){
    const group=aliasGroups.find(g=>g[0]===term||g.slice(1).includes(term));
    const matches=group?group.slice(1):[term];
    if(matches.some(t=>name.includes(t))) return true;
  }
  const vegetarian=['frango','bife','carne','linguica','presunto','bacon','peixe','atum','sardinha','camarao','frutos do mar','porco','suino','peru','salsicha','strogonoff'];
  const animalDairy=['leite','iogurte','queijo','requeijao','manteiga','whey','creme de leite'];
  const nuts=['castanha','amendoim','amendoas','nozes','avelas','pistache','oleaginosas','pasta de amendoim','granola'];
  const gluten=['pao','aveia','macarrao','lasanha','farofa','trigo','barra de cereais','cereal integral','biscoito'];
  const seafood=['peixe','atum','sardinha','salmao','bacalhau','camarao','caranguejo','lagosta','marisco','frutos do mar'];
  if(q.diet==='vegan' && (has(...vegetarian)||has(...animalDairy)||has('ovo','ovos','mel'))) return true;
  if(q.diet==='vegetarian' && has(...vegetarian)) return true;
  if(q.nuts_allergy && has(...nuts)) return true;
  if(q.seafood_allergy && has(...seafood)) return true;
  if(q.gluten && has(...gluten)) return true;
  if(q.lactose && has(...animalDairy) && !has('sem lactose','zero lactose','vegetal')) return true;
  if(q.dairy===false && has(...animalDairy)) return true;
  if(q.nuts===false && has(...nuts)) return true;
  if(q.fish===false && has(...seafood)) return true;
  if(q.beef===false && has('bife','carne bovina','carne moida','patinho','alcatra')) return true;
  // Não usar 'ave' como substring: ela aparece dentro de 'aveia'.
  if(q.chicken===false && has('frango')) return true;
  if(q.pork===false && has('porco','suino','linguica','bacon','presunto','salsicha')) return true;
  if(q.eggs===false && has('ovo','ovos')) return true;
  if(q.beans===false && has('feijao','lentilha','grao-de-bico','grao de bico')) return true;
  if(q.fruits===false && has('banana','fruta','maca','mamao','laranja','morango')) return true;
  if(q.veggies===false && has('legumes','verduras','salada','brocolis','couve-flor')) return true;
  if(q.rice===false && has('arroz')) return true;
  // Preferência por não comer pão não deve remover aveia, macarrão ou cereais.
  if(q.bread===false && has('pao')) return true;
  // Restrição livre: detectar apenas ingredientes explicitamente mencionados.
  const other=normalizeFoodText(q.other_restriction);
  if(other){
    const terms=['camarao','amendoim','castanha','leite','lactose','gluten','trigo','ovo','ovos','frango','carne bovina','carne suina','porco','peixe','atum','soja','tofu','arroz','feijao','banana','maca','morango','abacate','cafe'];
    if(terms.some(t=>other.includes(t)&&name.includes(t))) return true;
  }
  return false;
}
function filterFoodList(list,q){
  return (Array.isArray(list)?list:[]).filter(item=>!foodIsBlocked(item,q));
}
function sanitizeGeneratedDiet(q){
  if(!Array.isArray(S.personalMeals)) return;
  S.personalMeals.forEach(meal=>{
    if(Array.isArray(meal.items)) meal.items=filterFoodList(meal.items,q);
    if(Array.isArray(meal.base)) meal.base=filterFoodList(meal.base,q);
    if(Array.isArray(meal.baseItems)) meal.baseItems=filterFoodList(meal.baseItems,q);
    if(Array.isArray(meal.proteins)) meal.proteins=meal.proteins.filter(p=>!foodIsBlocked(p,q));
    if(Array.isArray(meal.specials)){
      meal.specials=meal.specials.filter(sp=>!foodIsBlocked(sp,q));
      meal.specials.forEach(sp=>{if(Array.isArray(sp.items)) sp.items=filterFoodList(sp.items,q);});
    }
    if(Array.isArray(meal.options)){
      meal.options=meal.options.filter(opt=>!foodIsBlocked(opt,q));
      meal.options.forEach(opt=>{
        if(Array.isArray(opt.items)) opt.items=filterFoodList(opt.items,q);
        if(Array.isArray(opt.base)) opt.base=filterFoodList(opt.base,q);
        if(Array.isArray(opt.baseItems)) opt.baseItems=filterFoodList(opt.baseItems,q);
        if(Array.isArray(opt.proteins)) opt.proteins=opt.proteins.filter(p=>!foodIsBlocked(p,q));
      });
    }
  });
  // If a group has no safe choice, do not silently insert a prohibited food.
  // Show a clear placeholder so the user can edit the restriction/profile.
  const placeholder={e:'⚠️',n:'Nenhuma opção compatível encontrada',q:'Revise suas preferências ou consulte um nutricionista'};
  S.personalMeals.forEach(meal=>{
    if(meal.type==='simple' && (!meal.items||!meal.items.length)) meal.items=[{...placeholder}];
    if(meal.type==='lunch'){
      if(!meal.base?.length) meal.base=[{e:'⚠️',n:'Escolha uma base compatível com suas restrições',q:''}];
      if(!meal.proteins?.length) meal.proteins=[{id:'review',...placeholder}];
      if(!meal.specials) meal.specials=[];
    }
    if(meal.type==='options' && (!meal.options||!meal.options.length)) meal.options=[{id:'review',e:'⚠️',n:'Opções precisam de revisão',items:[{...placeholder}]}];
    if(meal.type==='optional' && (!meal.items||!meal.items.length)) meal.items=[{...placeholder}];
  });
}

/* ====== MOTOR DE DECISÃO DE PERFIL ======
   Regras transparentes: combina etapa de vida, preferências, restrições,
   custo, tempo/capacidade de preparo e possibilidade de transportar refeições.
   Não presume que uma faixa etária goste de um alimento específico. */
function buildDecisionProfile(q){
  const age=Number(q?.age||S.profile?.age||0);
  const lifeStage=!age?'unspecified':age<18?'adolescent':age<65?'adult':'older_adult';
  return {
    age, lifeStage,
    dayRole:q?.dayRole||'neither', wakeTime:q?.wakeTime||'07:00', sleepTime:q?.sleepTime||'22:00',
    occupiedBlocks:[
      ...(['study','both'].includes(q?.dayRole)?[{type:'study',start:q.studyStart||'08:00',end:q.studyEnd||'12:00'}]:[]),
      ...(['work','both'].includes(q?.dayRole)?[{type:'work',start:q.workStart||'09:00',end:q.workEnd||'17:00'}]:[])
    ],
    diet:q?.diet||'omnivore', budget:q?.budget||'medium', cookTime:q?.cookTime||'medium',
    cooks:q?.cooks||'self', mealAccess:q?.mealAccess||'mixed', affordableProteins:Array.isArray(q?.affordableProteins)?q.affordableProteins:[],
    hasFridge:q?.hasFridge??null, hasThermalBag:q?.hasThermalBag??null, hasMicrowave:q?.hasMicrowave??null, breakMinutes:q?.breakMinutes||'unknown', dislikedFoods:q?.dislikedFoods||'',
    restrictions:{lactose:!!q?.lactose,gluten:!!q?.gluten,nuts:!!q?.nuts_allergy,seafood:!!q?.seafood_allergy,other:q?.other_restriction||''},
    preferences:{beef:q?.beef!==false,chicken:q?.chicken!==false,pork:q?.pork!==false,fish:q?.fish!==false,eggs:q?.eggs!==false,beans:q?.beans!==false,rice:q?.rice!==false,bread:q?.bread!==false,fruits:q?.fruits!==false,veggies:q?.veggies!==false,dairy:q?.dairy!==false,nuts:q?.nuts!==false,coffeeStyle:q?.coffeeStyle||null,veggieStyle:q?.veggieStyle||null},
    needsPortableMeals:['packed','buy'].includes(q?.mealAccess),
    simplePrep:(q?.cookTime==='quick'||q?.cooks==='buys'),
    prioritizeLowCost:q?.budget==='low'
  };
}
function applyProfileDecisionRules(meals,q){
  if(!Array.isArray(meals)||!q)return;
  const d=buildDecisionProfile(q);
  const mealById=id=>meals.find(m=>m.id===id);
  // Low-budget rule: rank common low-cost protein options first, without forbidding foods.
  if(d.prioritizeLowCost || d.affordableProteins.length){
    const defaultRank={frango:0,ovos:1,carne:2,bife:3,tofu:4,grao:5};
    const selectedRank={}; d.affordableProteins.forEach((id,index)=>{selectedRank[id]=index;});
    const rank=id=>{
      const key=({carne:'bife',grao:'feijao'}[id]||id);
      if(Object.keys(selectedRank).length){
        if(key==='feijao') return selectedRank.feijao??(selectedRank.tofu!==undefined?selectedRank.tofu+1:99);
        return selectedRank[key]??99;
      }
      return defaultRank[id]??9;
    };
    for(const m of meals){
      if(Array.isArray(m.proteins))m.proteins.sort((a,b)=>rank(a.id)-rank(b.id));
      for(const o of (m.options||[]))if(Array.isArray(o.proteins))o.proteins.sort((a,b)=>rank(a.id)-rank(b.id));
    }
  }
  // Fast prep or mostly purchased meals: avoid complex/mixed dishes whose ingredients are
  // harder to verify; preserve the standard assembled meal if available.
  if(d.simplePrep){
    const lunch=mealById('almoco'); if(lunch&&Array.isArray(lunch.specials))lunch.specials=[];
    const dinner=mealById('jantar');
    if(dinner&&Array.isArray(dinner.options)){
      const normal=dinner.options.find(o=>o.id==='normal');
      if(normal)dinner.options=[normal];
    }
  }
  // For transport/buy-out days, label meal components as packable/portable options.
  // Food safety is not assumed: perishable foods still require suitable temperature control.
  if(d.needsPortableMeals){
    const snack=mealById('escola');
    if(snack){
      snack.name=d.lifeStage==='adolescent'?'Lanche para escola/curso':'Lanche para levar';
      snack.emoji='🎒';
      if(Array.isArray(snack.items))snack.items=snack.items.map(i=>({...i,q:[i.q,'opção para transportar; use refrigeração/bolsa térmica quando necessário'].filter(Boolean).join(' · ')}));
    }
    const lunch=mealById('almoco');
    if(lunch){
      lunch.name=d.mealAccess==='buy'?'Almoço fora de casa':'Almoço para levar';
      if(Array.isArray(lunch.base))lunch.base=lunch.base.map(i=>({...i,q:[i.q,'porção prática para marmita'].filter(Boolean).join(' · ')}));
      if(Array.isArray(lunch.baseItems))lunch.baseItems=lunch.baseItems.map(i=>({...i,q:[i.q,'porção prática para marmita'].filter(Boolean).join(' · ')}));
    }
  }
  // Practical constraints: never imply that perishable food is safe without temperature control.
  if(d.needsPortableMeals){
    const lunch=mealById('almoco');
    if(lunch && d.hasFridge===false && d.hasThermalBag!==true){
      lunch.name='Almoço fora / opção segura para levar';
      const warning='ATENÇÃO: sem geladeira ou bolsa térmica, não transporte carnes, ovos ou laticínios perecíveis por horas. Prefira comprar na hora ou use conservação adequada.';
      if(Array.isArray(lunch.base)) lunch.base=lunch.base.map(i=>({...i,q:[i.q,warning].filter(Boolean).join(' · ')}));
      if(Array.isArray(lunch.baseItems)) lunch.baseItems=lunch.baseItems.map(i=>({...i,q:[i.q,warning].filter(Boolean).join(' · ')}));
      if(Array.isArray(lunch.proteins)) lunch.proteins=lunch.proteins.map(i=>({...i,q:[i.q,warning].filter(Boolean).join(' · ')}));
    }
    if(lunch && d.hasMicrowave===false){
      const note='Sem micro-ondas: confirme se o local oferece alternativa para aquecer ou escolha uma refeição segura para consumo frio.';
      if(Array.isArray(lunch.base)) lunch.base=lunch.base.map(i=>({...i,q:[i.q,note].filter(Boolean).join(' · ')}));
    }
    const snack=mealById('escola');
    if(snack && d.breakMinutes==='under10'){
      snack.name='Lanche rápido (pausa curta)';
      if(Array.isArray(snack.items)) snack.items=snack.items.map(i=>({...i,q:[i.q,'pensado para uma pausa de até 10 minutos'].filter(Boolean).join(' · ')}));
    }
  }
  // A life-stage rule changes wording/guardrails, not tastes: age never forces salad or coffee.
  for(const m of meals){
    if(d.lifeStage==='adolescent' && ['escola','pos'].includes(m.id) && !m.name.toLowerCase().includes('escola')){
      if(m.id==='escola')m.name='Lanche do dia';
    }
  }
}

/* ====== DIETA PERSONALIZADA (refatorada) ====== */
function timeToMinutes(value, fallback){
  const v=String(value||fallback||'07:00'); const m=v.match(/^(\d{1,2}):(\d{2})$/);
  return m?Math.max(0,Math.min(1439,Number(m[1])*60+Number(m[2]))):420;
}
function minutesToTime(value){
  const m=((Math.round(value)%1440)+1440)%1440;
  return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
}
function applyRoutineMealTimes(meals,q){
  if(!Array.isArray(meals)||!q)return;
  const wake=timeToMinutes(q.wakeTime,'07:00');
  let sleep=timeToMinutes(q.sleepTime,'22:00');
  if(sleep<=wake)sleep+=1440;
  const span=Math.max(600,sleep-wake);
  const ids=['cafe','escola','almoco','pos','jantar','ceia'];
  const ratios=[0.07,0.25,0.43,0.62,0.80,0.92];
  const blocks=[];
  const addBlock=(start,end)=>{
    if(!start||!end)return;
    let a=timeToMinutes(start,'00:00'),b=timeToMinutes(end,'00:00');
    if(a===b)return; if(b<a)b+=1440;
    blocks.push({start:a,end:b});
  };
  if(['study','both'].includes(q.dayRole))addBlock(q.studyStart,q.studyEnd);
  if(['work','both'].includes(q.dayRole))addBlock(q.workStart,q.workEnd);
  const assigned=[];
  const inBlock=t=>blocks.some(b=>t>=b.start&&t<b.end);
  ids.forEach((id,i)=>{
    const meal=meals.find(m=>m.id===id); if(!meal)return;
    const target=Math.round(wake+span*ratios[i]);
    const lower=Math.max(wake+15,assigned.length?assigned[assigned.length-1]+45:wake+15);
    const upper=Math.max(lower, sleep-20);
    let chosen=null;
    // Find the nearest available time while preserving meal order and avoiding occupied blocks.
    for(let delta=0;delta<=240&&chosen===null;delta+=15){
      const candidates=delta===0?[target]:[target-delta,target+delta];
      for(let t of candidates){
        if(t<lower||t>upper)continue;
        if(i===0&&t>wake+120)continue;
        if(i===5&&t>sleep-30)continue;
        if(!inBlock(t)){chosen=t;break;}
      }
    }
    // If the closest slot is unavailable, search forward for the next feasible gap.
    if(chosen===null){
      for(let t=lower;t<=upper;t+=15){if(!inBlock(t)){chosen=t;break;}}
    }
    // In an unusually restrictive schedule, keep a valid time rather than breaking generation.
    if(chosen===null)chosen=Math.min(upper,Math.max(lower,target));
    meal.time=minutesToTime(chosen); assigned.push(chosen);
  });
}

function buildPersonalizedDiet(){
  if(!S.q||!S.q.done)return;
  const q=S.q;
  const macros=calcMacros(S.profile);
  const isVeg=['vegetarian','vegan'].includes(q.diet);
  const isVegan=q.diet==='vegan';
  const treina=['light','moderate','active','veryactive'].includes(q.activity);
  const idade=q.age||S.profile.age;
  const menor=idade&&idade<18;
  const muitoNovo=idade&&idade<15;

  /* ── Café da manhã ──────────────────────── */
  const cafeItems=[];
  if(q.gluten){
    cafeItems.push({e:'🌽',n:'Tapioca simples',q:'porção a ajustar'});
  } else if(q.bread!==false){
    cafeItems.push({e:'🥖',n:'Pão francês',q:'1 unidade (~50g)'});
  } else {
    cafeItems.push({e:'🥣',n:'Aveia',q:'40g'});
  }

  if(!isVegan&&q.eggs!==false)
    cafeItems.push({e:'🍳',n:'Ovos',q:'2 unidades'});
  else if(q.fruits!==false)
    cafeItems.push({e:'🍌',n:'Banana',q:'1 unidade'});

  // Preferência declarada tem prioridade; idade serve apenas para sugerir um padrão inicial.
  const coffeeStyle=q.coffeeStyle||(Number(idade||18)<18?'milk':'black');
  if(coffeeStyle==='milk'){
    if(isVegan) cafeItems.push({e:'☕',n:'Café com bebida vegetal (confirmar rótulo)',q:''});
    else if(q.dairy!==false) cafeItems.push({e:'☕',n:q.lactose?'Café com leite sem lactose':'Café com leite',q:''});
    else cafeItems.push({e:'☕',n:'Café preto',q:''});
  } else if(coffeeStyle==='tea')
    cafeItems.push({e:'🍵',n:'Chá',q:''});
  else if(coffeeStyle==='black')
    cafeItems.push({e:'☕',n:'Café preto',q:''});
  // coffeeStyle === 'none': não acrescenta bebida, conforme preferência do usuário.

  function vegetableSideItems(){
    if(q.veggies===false||q.veggieStyle==='rarely') return [];
    const style=q.veggieStyle||(Number(idade||18)<18?'cooked':'both');
    const items=[];
    if(style==='raw'||style==='both') items.push({e:'🥗',n:'Salada crua (folhas e vegetais à escolha)',q:'porção conforme preferência'});
    if(style==='cooked'||style==='both') items.push({e:'🥦',n:'Legumes cozidos, refogados ou assados',q:'porção conforme preferência'});
    return items;
  }

  /* ── Lanche da manhã ────────────────────── */
  const lancheNome=menor?'Lanche da escola':'Lanche da manhã';
  const lancheEmoji=menor?'🏫':'🌤️';
  const lancheItems=[];
  if(q.fruits!==false)
    lancheItems.push({e:'🍎',n:'Fruta (banana, maçã ou mamão)',q:'1 unidade'});
  else if(!isVegan&&q.dairy!==false&&!q.lactose)
    lancheItems.push({e:'🥣',n:'Iogurte natural',q:'1 unidade'});
  else if(q.nuts!==false)
    lancheItems.push({e:'🥜',n:'Castanhas ou amendoim',q:'30g'});
  else
    lancheItems.push({e:'🌾',n:'Barra de cereais integral',q:'1 unidade'});

  /* ── Lanche da tarde / Pós-treino ───────── */
  const posNome=treina?'Pós-treino / Lanche':'Lanche da tarde';
  const posEmoji=treina?'🏋️':'🕓';

  /* ── Lista de proteínas ─────────────────── */
  function buildProts(limit){
    const p=[];
    if(!isVeg&&q.chicken!==false) p.push({id:'frango',e:'🍗',n:'Frango',q:'120–150g'});
    if(!isVeg&&q.beef!==false)    p.push({id:'bife',e:'🥩',n:'Bife',q:'120–150g'});
    if(!isVeg&&q.pork!==false)    p.push({id:'carne',e:'🥩',n:'Carne moída',q:'120–150g'});
    if(!isVegan&&q.eggs!==false)  p.push({id:'ovos',e:'🍳',n:'Ovos',q:'2–3 unidades'});
    if(isVegan)                   p.push({id:'tofu',e:'🧆',n:'Tofu grelhado',q:'150g'},{id:'grao',e:'🫘',n:'Grão-de-bico',q:'150g'});
    if(p.length===0 && !isVeg && q.eggs!==false) p.push({id:'ovos',e:'🍳',n:'Ovos',q:'2–3 unidades'});
    if(p.length===0 && isVegan) p.push({id:'tofu',e:'🧆',n:'Tofu grelhado',q:'150g'},{id:'grao',e:'🫘',n:'Grão-de-bico',q:'150g'});
    return limit?p.slice(0,limit):p;
  }

  /* ── Base arroz+feijão ou alternativa ───── */
  function buildBase(){
    if(q.rice!==false&&q.beans!==false)
      return [{e:'🍚',n:'Arroz cozido',q:'150g'},{e:'🫘',n:'Feijão',q:'100g'}];
    if(q.rice===false&&q.beans!==false)
      return [{e:'🥔',n:'Batata ou mandioca',q:'180g'},{e:'🫘',n:'Feijão',q:'100g'}];
    if(q.rice!==false&&q.beans===false)
      return [{e:'🍚',n:'Arroz cozido',q:'150g'},{e:'🥕',n:'Legumes cozidos',q:'100g'}];
    return [{e:'🥔',n:'Batata cozida',q:'200g'},{e:'🥕',n:'Legumes variados',q:'150g'}];
  }

  /* ── Ceia ───────────────────────────────── */
  function buildCeia(){
    const it=[];
    if(q.fruits!==false)                              it.push({e:'🍌',n:'Banana',q:'1 unidade'});
    if(!isVegan&&q.dairy!==false&&!q.lactose)         it.push({e:'🥛',n:'Leite',q:'200ml'});
    if(!isVegan&&q.dairy!==false&&!q.lactose)         it.push({e:'🥣',n:'Iogurte',q:'1 unidade'});
    if(!isVegan&&q.eggs!==false&&q.bread!==false&&!q.gluten)
                                                       it.push({e:'🥖',n:'Pão + ovo',q:'1 pão + 1 ovo'});
    if(it.length===0)                                  it.push({e:'🍎',n:'Fruta de sua preferência',q:'1 unidade'});
    return it;
  }

  /* ── Aplicar mudanças em S.personalMeals (cópia isolada) ── */
  S.personalMeals=deepCopy(D.meals);
  S.personalMeals.forEach(meal=>{
    switch(meal.id){
      case'cafe':
        meal.items=cafeItems;
        break;
      case'escola':
        meal.name=lancheNome;
        meal.emoji=lancheEmoji;
        meal.items=lancheItems;
        break;
      case'almoco':
        meal.proteins=buildProts();
        meal.base=meal.baseItems=[...buildBase(),...vegetableSideItems()];
        if(isVeg) meal.specials=[]; // ingredientes de pratos mistos não são verificáveis com segurança
        if(q.gluten) meal.specials=meal.specials.filter(s=>!['lasanha','macesp'].includes(s.id));
        break;
      case'pos':
        meal.name=posNome;
        meal.emoji=posEmoji;
        if(q.fruits===false) meal.options=meal.options.filter(o=>!o.id.startsWith('vita'));
        if(q.lactose||isVegan) meal.options=meal.options.map(opt=>({
          ...opt,items:(opt.items||[]).map(i=>{
            if(!normalizeFoodText(i.n).includes('leite')) return i;
            if(isVegan) return {...i,n:'Bebida vegetal (confirmar ingredientes e rótulo)'};
            return {...i,n:'Leite sem lactose (confirmar rótulo)'};
          })
        }));
        if(meal.options.length===0) meal.options=[{id:'fruta',e:'🍎',n:'Lanche simples',items:[
          ...(q.fruits!==false?[{e:'🍎',n:'Fruta',q:'1 unidade'}]:[]),
          ...(!isVegan&&q.dairy!==false&&!q.lactose?[{e:'🥛',n:'Iogurte natural',q:'1 unidade'}]:[]),
          ...(isVegan?[{e:'🫘',n:'Grão-de-bico cozido',q:'porção a ajustar'}]:[])
        ]}];
        break;
      case'jantar':
        const norm=meal.options?.find(o=>o.id==='normal');
        if(norm){
          norm.proteins=buildProts(3);
          norm.base=norm.baseItems=[...buildBase(),...vegetableSideItems()];
        }
        if(isVeg) meal.options=meal.options?.filter(o=>o.id!=='macfr');
        if(q.gluten) meal.options=meal.options?.filter(o=>o.id!=='macfr');
        break;
      case'ceia':
        meal.items=buildCeia();
        break;
    }
  });

  applyProfileDecisionRules(S.personalMeals,q);
  applyRoutineMealTimes(S.personalMeals,q);
  sanitizeGeneratedDiet(q);
  if(q.name) S.personName=q.name;
  save();
}

/* ====== NAV ====== */
function goTab(tab){
  S.tab=tab;
  document.querySelectorAll('.nv').forEach(el=>el.classList.toggle('on',el.dataset.tab===tab));
  document.getElementById('aibar').classList.remove('on');

  document.getElementById('cnt').classList.add('pb');

try {

} catch(bootDietError) {

  if(S?.q){ S.q.done=false; S.q.step=0; }
  S._dietBootError=bootDietError;
  if(window.__dietaryShowBootError) window.__dietaryShowBootError((bootDietError?.message||String(bootDietError))+' (inicialização)');
}
setTimeout(()=>{
  try {
    const splash=document.getElementById('splash'); if(splash)splash.classList.add('out');
    const app=document.getElementById('app'); if(app)app.style.display='flex';
    if(!S.q){
      showWelcome();
    } else if(S.q.done){
      try { if(!isDemo) buildPersonalizedDiet(); renderToday(); }
      catch(savedDietError){
        console.error('Dietary: falha ao abrir perfil salvo; mantendo os dados e abrindo revisão.',savedDietError);
        S.q.done=false; S.q.step=0; initQ(); renderToday();
      }
    } else {
      initQ(); renderToday();
    }
    setTimeout(()=>{const sp=document.getElementById('splash');if(sp)sp.style.display='none';},600);
  } catch(startupError) {
    console.error('Dietary: falha durante a inicialização.',startupError);
    if(window.__dietaryShowBootError) window.__dietaryShowBootError(startupError.stack||startupError.message||startupError);
    else { const app=document.getElementById('app');if(app)app.style.display='flex';const splash=document.getElementById('splash');if(splash)splash.style.display='none'; }
  }
},1900);

<style id="bia-chat-css">
.msg.u{white-space:pre-wrap}
.msg.a p{margin:0 0 8px}.msg.a p:last-of-type{margin-bottom:0}
.msg.a ul,.msg.a ol{margin:4px 0 8px 18px;padding:0}
.msg.a pre{overflow:auto;background:var(--sf2);padding:10px;border-radius:10px;font-size:12px;margin:6px 0}
.msg.a table{border-collapse:collapse;font-size:12px;display:block;overflow:auto;margin:6px 0}
.msg.a td,.msg.a th{border:1px solid var(--bd);padding:4px 8px;text-align:left}
.bia-act{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.bia-act button,.bia-tools button{background:var(--sf2);border:1px solid var(--bd);color:var(--t2);border-radius:99px;padding:6px 11px;font-size:11px;font-weight:600;font-family:inherit;cursor:pointer}
.bia-act button[aria-pressed=true]{color:var(--g);border-color:var(--g)}
.bia-tools{margin-left:auto;display:flex;gap:6px;flex-shrink:0}.bia-tools button{color:var(--t1);font-size:12px;white-space:nowrap;padding:6px 10px}
.msgs .msg-row:not(:last-child) .msg{animation:none}
.bia-err{margin:8px 0 0 36px;padding:12px 14px;border:1px solid rgba(239,68,68,.5);background:rgba(239,68,68,.08);color:var(--t1);border-radius:14px;font-size:13px;line-height:1.5}
#bia-reset-ov{position:fixed;inset:0;z-index:950;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#bia-reset-ov.on{display:flex}
#bia-reset-ov .brs-bx{width:100%;max-width:480px;background:var(--bg);color:var(--t1);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.qerr{margin:10px 0 0;padding:11px 13px;border:1px solid rgba(239,68,68,.45);background:rgba(239,68,68,.07);border-radius:13px;font-size:13px;line-height:1.5;color:var(--t1)}
.brs-t{font-size:19px;font-weight:750;margin-bottom:6px}
.brs-s{font-size:13px;line-height:1.55;color:var(--t2);margin-bottom:16px}
.brs-b{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;font-family:inherit;color:var(--t1);cursor:pointer}
.brs-b b{display:block;font-size:15px;font-weight:700;margin-bottom:3px}
.brs-b span{display:block;font-size:12px;line-height:1.5;color:var(--t2)}
.brs-b.brs-d{border-color:rgba(239,68,68,.55)}.brs-b.brs-d b{color:#C0392B}
.brs-c{display:block;width:100%;background:none;border:0;padding:14px;font-family:inherit;font-size:15px;font-weight:650;color:var(--t2);cursor:pointer}
.bia-err button{display:block;margin-top:8px;background:var(--g);color:#fff;border:0;border-radius:99px;padding:8px 14px;font-size:12px;font-weight:700;font-family:inherit;cursor:pointer}
#bia-hist{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
#bia-hist.on{display:flex}
#bia-hist .bh{width:100%;max-width:480px;max-height:78vh;overflow:auto;background:var(--bg);color:var(--t1);border-radius:24px 24px 0 0;padding:18px}
.bh-t{font-size:18px;font-weight:750;margin-bottom:12px}.bh-e{color:var(--t3);font-size:14px;padding:12px 0}
.bh-r{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.bh-o{flex:1;min-width:0;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:11px 13px;color:var(--t1);font-family:inherit;font-size:14px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.bh-o b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bh-o span{font-size:11px;color:var(--t3)}
.bh-d{background:none;border:1px solid var(--bd);border-radius:12px;padding:10px;cursor:pointer;font-size:15px}
.bh-l{display:block;font-size:12px;color:var(--t2);margin-top:10px}.bh-i{display:block;width:100%;box-sizing:border-box;margin-top:4px;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--t1);font-family:inherit;font-size:14px}
</style>

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){
 s=esc(s);const code=[];
 s=s.replace(/```[a-z]*\n?([\s\S]*?)```/g,(_,c)=>{code.push(c);return '\uE000'+(code.length-1)+'\uE000'});
 const inl=t=>t.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>');
 const out=[];let ls=null,tb=null;
 const flush=()=>{if(ls){out.push('<'+ls.t+'>'+ls.i.join('')+'</'+ls.t+'>');ls=null}if(tb){out.push('<table>'+tb.join('')+'</table>');tb=null}};
 s.split('\n').forEach(l=>{
  let m;
  if(m=l.match(/^\s*([-*•]|\d+[.)])\s+(.*)/)){const t=/\d/.test(m[1])?'ol':'ul';if(ls&&ls.t!==t)flush();if(tb)flush();(ls=ls||{t:t,i:[]}).i.push('<li>'+inl(m[2])+'</li>');return}
  if(/^\s*\|.*\|\s*$/.test(l)){if(/^[\s|:-]+$/.test(l))return;if(ls)flush();const first=!tb;const c=l.trim().slice(1,-1).split('|').map(x=>x.trim());(tb=tb||[]).push('<tr>'+c.map(x=>first?'<th>'+inl(x)+'</th>':'<td>'+inl(x)+'</td>').join('')+'</tr>');return}
  flush();
  if(m=l.match(/^#{1,4}\s+(.*)/)){out.push('<p><b>'+inl(m[1])+'</b></p>');return}
  if(l.trim())out.push('<p>'+inl(l)+'</p>');
 });
 flush();
 return out.join('').replace(/\uE000(\d+)\uE000/g,(_,i)=>'<pre><code>'+code[+i]+'</code></pre>');
}

const TOOLS_RULES=`Você tem ferramentas de consulta à base nutricional USDA FoodData Central (nomes em inglês).

let NUT;

function parseCall(t){

const foot=used=>!used.size?'':'\n\n—\nFonte dos dados: USDA FoodData Central (domínio público, CC0)\nRegistros usados:\n'+[...used.values()].map(f=>'• '+f.name+' (ID '+f.source_id+(f.data_type?', '+f.data_type:'')+(f.source_version?', '+f.source_version:'')+')').join('\n');
async function viaTools(sys,tn,call,show,st){

  noteSrc(used,out);

 }

window.biaCfgClear=function(){try{localStorage.removeItem('bia_ai_cfg_v1')}catch(e){}window.__biaCfg=null;document.getElementById('bck').value='';document.getElementById('bcs').textContent='Chave removida deste aparelho.'};
window.aiSend=function(){
 if(busy){window.aiStop();return}
 const inp=document.getElementById('aiinp'),txt=inp.value.trim();if(!txt)return;
 if(txt.length>MAXLEN){err='Mensagem longa demais (máximo de '+MAXLEN+' caracteres).';renderAIMsgs(false);return}
 stopListening();inp.value='';inp.style.height='auto';
 const c=cur()||newChat();
 c.m.push({r:'user',c:txt});if(c.m.length===1)c.t=txt.slice(0,48);
 if(c.m.length>MAXM)c.m.splice(0,c.m.length-MAXM);
 run();
};
window.aiStop=function(){if(ctl){ctl.st.stopped=true;ctl.abort()}};
const trimToUser=()=>{const c=cur();if(!c)return false;while(c.m.length&&c.m[c.m.length-1].r!=='user')c.m.pop();return c.m.length>0};
window.biaRetry=function(){if(!busy&&trimToUser()){err=null;run()}};
window.biaRegen=window.biaRetry;
window.biaCopy=function(i,b){const t=S.aiMsgs[i]&&S.aiMsgs[i].c;if(!t)return;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copiado'},()=>{b.textContent='Não copiou'})};
window.biaFb=function(i,v){const m=S.aiMsgs[i];if(!m)return;m.fb=m.fb===v?null:v;saveC();renderAIMsgs(false)};
window.biaNew=function(){if(busy)return;C.cur=null;S.aiMsgs=[];err=null;saveC();renderAIMsgs(false)};
window.biaHist=function(){
 let p=document.getElementById('bia-hist');
 if(!p){p=document.createElement('div');p.id='bia-hist';p.onclick=e=>{if(e.target===p)p.classList.remove('on')};document.body.appendChild(p)}
 const fmt=t=>new Date(t).toLocaleDateString('pt-BR',{day:'2-digit',month:'short'});
 const rows=C.list.filter(c=>c.m.length).map(c=>`<div class="bh-r"><button class="bh-o" onclick="biaOpen('${c.id}')"><b>${esc(c.t)}</b><span>${fmt(c.u)} · ${c.m.length} mensagens</span></button><button class="bh-d" aria-label="Excluir conversa" onclick="biaDel('${c.id}')">🗑</button></div>`).join('');
 p.innerHTML='<div class="bh" role="dialog" aria-label="Conversas anteriores"><div class="bh-t">Conversas</div>'+(rows||'<div class="bh-e">Nenhuma conversa salva ainda.</div>')+'</div>';
 p.classList.add('on');
};
window.biaOpen=function(id){if(busy)return;C.cur=id;attach();err=null;saveC();document.getElementById('bia-hist').classList.remove('on');renderAIMsgs(false)};
window.biaDel=function(id){if(!confirm('Excluir esta conversa? Essa ação não pode ser desfeita.'))return;C.list=C.list.filter(c=>c.id!==id);if(C.cur===id){C.cur=null;S.aiMsgs=[]}saveC();biaHist();renderAIMsgs(false)};
window.biaChatsReset=function(){C={list:[],cur:null};busy=false;err=null;S.aiMsgs=[];try{localStorage.removeItem(BK)}catch(e){}};
})();
</script>
